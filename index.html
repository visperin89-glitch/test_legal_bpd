    <style id="app-styles">
        body {
            font-family: 'Montserrat', sans-serif;
        }
        /* Античит: Заборона виділення тексту під час тестування */
        .exam-mode-active {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
        @media print { 
            .no-print { display: none !important; } 
            .print-border { border: 1px solid #e2e8f0 !important; box-shadow: none !important; }
            html, body, .print-light-page { background-color: #ffffff !important; color: #1e293b !important; }
            .print-light-card { background-color: #ffffff !important; border-color: #e2e8f0 !important; color: #1e293b !important; }
            .print-light-summary { background-color: #f4f6f9 !important; border-color: #e2e8f0 !important; color: #1e293b !important; }
            .print-light-heading { color: #133863 !important; }
            .print-light-subtext { color: #475569 !important; }
            .print-light-correct { background-color: #ecfdf5 !important; color: #065f46 !important; border-color: #d1fae5 !important; }
            .print-light-wrong { background-color: #fef2f2 !important; color: #991b1b !important; border-color: #fee2e2 !important; }
            .print-show-logo { display: block !important; }
            .print-hide-logo { display: none !important; }
        }
    </style>

                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                <line x1="1" y1="12" x2="3" y2="12" />
                <line x1="21" y1="12" x2="23" y2="12" />
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
            </svg>
        );

        const EXAM_DURATION_SECONDS = 1200;
        const MAX_EXAM_QUESTIONS = 20;
        const ADMIN_PAGE_SIZE = 20;

        const BPD_SECRET_SALT = "BPD_LEGAL_2026_SECURE";
        const ADMIN_PASS_HASH = "aa108b4665f01285";

        const computeHash = (rawString) => {
            const input = String(rawString ?? '') + BPD_SECRET_SALT;
            const bytes = new TextEncoder().encode(input);
            let h1 = 0x811c9dc5;
            let h2 = 0x9e3779b9;
            for (let i = 0; i < bytes.length; i++) {
                const b = bytes[i];
                h1 ^= b;
                h1 = Math.imul(h1, 0x01000193) >>> 0;
                h2 ^= (b + ((i * 31) & 0xff)) & 0xff;
                h2 = Math.imul(h2, 0x85ebca6b) >>> 0;
                h2 = ((h2 << 13) | (h2 >>> 19)) >>> 0;
            }
            h1 ^= h1 >>> 16;
            h1 = Math.imul(h1, 0x85ebca6b) >>> 0;
            h1 ^= h1 >>> 13;
            h1 = Math.imul(h1, 0xc2b2ae35) >>> 0;
            h1 ^= h1 >>> 16;

            h2 ^= h2 >>> 16;
            h2 = Math.imul(h2, 0xc2b2ae35) >>> 0;
            h2 ^= h2 >>> 13;
            h2 = Math.imul(h2, 0x85ebca6b) >>> 0;
            h2 ^= h2 >>> 16;

            return (h1 >>> 0).toString(16).padStart(8, '0') + (h2 >>> 0).toString(16).padStart(8, '0');
        };

        const hashAnswer = (questionText, optionText) => {
            return computeHash(String(questionText ?? '').trim() + "::" + String(optionText ?? '').trim());
        };

        const encodeExplanation = (text) => {
            const str = String(text ?? '');
            if (!str) return '';
            const encoder = new TextEncoder();
            const dataBytes = encoder.encode(str);
            const keyBytes = encoder.encode(BPD_SECRET_SALT);
            const xored = new Uint8Array(dataBytes.length);
            for (let i = 0; i < dataBytes.length; i++) {
                xored[i] = dataBytes[i] ^ keyBytes[i % keyBytes.length];
            }
            let binary = '';
            for (let i = 0; i < xored.length; i++) {
                binary += String.fromCharCode(xored[i]);
            }
            return btoa(binary);
        };

        const decodeExplanation = (encodedStr) => {
            const str = String(encodedStr ?? '');
            if (!str) return '';
            const trimmed = str.trim();
            if (trimmed.length % 4 !== 0 || !/^[A-Za-z0-9+/]+={0,2}$/.test(trimmed)) {
                return str;
            }
            try {
                const binary = atob(trimmed);
                const encoder = new TextEncoder();
                const keyBytes = encoder.encode(BPD_SECRET_SALT);
                const decodedBytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) {
                    decodedBytes[i] = binary.charCodeAt(i) ^ keyBytes[i % keyBytes.length];
                }
                const result = new TextDecoder('utf-8', { fatal: true }).decode(decodedBytes);
                if (/[\x00-\x08\x0B\x0C\x0E-\x1F]/.test(result)) {
                    return str;
                }
                return result;
            } catch (e) {
                return str;
            }
        };

        const findCorrectOptionIndex = (questionText, options, ansHash) => {
            if (!Array.isArray(options) || !ansHash) return -1;
            return options.findIndex(opt => hashAnswer(questionText, opt) === ansHash);
        };

        window.BPD_SECRET_SALT = BPD_SECRET_SALT;
        window.computeHash = computeHash;
        window.hashAnswer = hashAnswer;
        window.encodeExplanation = encodeExplanation;
        window.decodeExplanation = decodeExplanation;

        window.QUIZ_MODULES = window.QUIZ_MODULES || {};
        const moduleScriptPromises = new Map();

        const shuffleArray = (array) => {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        };

        const formatTime = (seconds) => {
            const safeSeconds = Math.max(0, seconds);
            const m = Math.floor(safeSeconds / 60).toString().padStart(2, '0');
            const s = (safeSeconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        };

        const escapeHtml = (value) => {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        };

        const safeSerializeForScript = (data) => {
            return JSON.stringify(data, null, 2)
                .replace(/</g, '\\u003c')
                .replace(/>/g, '\\u003e')
                .replace(/\u2028/g, '\\u2028')
                .replace(/\u2029/g, '\\u2029');
        };

        const normalizeQuestion = (rawQ) => {
            if (!rawQ || typeof rawQ !== 'object') return null;
            const questionText = typeof rawQ.question === 'string' ? rawQ.question.trim() : '';
            if (!questionText) return null;

            const rawOptions = Array.isArray(rawQ.options)
                ? rawQ.options
                : (Array.isArray(rawQ.answerOptions) ? rawQ.answerOptions : null);
            if (!rawOptions || rawOptions.length < 2) return null;

            // Новий захищений або плоский формат з масивом рядків
            if (rawOptions.every(opt => typeof opt === 'string')) {
                const optionTexts = [...rawOptions];
                let ansHash = typeof rawQ.ansHash === 'string' && rawQ.ansHash.trim() ? rawQ.ansHash.trim() : '';
                if (!ansHash) {
                    const rawCorrect = Number.isInteger(rawQ.correct) ? rawQ.correct : 0;
                    const safeIdx = rawCorrect >= 0 && rawCorrect < optionTexts.length ? rawCorrect : 0;
                    ansHash = hashAnswer(rawQ.question, optionTexts[safeIdx]);
                }

                let expEnc = '';
                if (typeof rawQ.expEnc === 'string' && rawQ.expEnc.trim()) {
                    expEnc = rawQ.expEnc.trim();
                } else if (typeof rawQ.explanation === 'string' && rawQ.explanation) {
                    expEnc = encodeExplanation(rawQ.explanation);
                }

                return {
                    question: rawQ.question,
                    options: optionTexts,
                    ansHash,
                    expEnc
                };
            }

            // Зворотна сумісність із попереднім форматом об'єктів { text, isCorrect, rationale }
            const mappedOptions = rawOptions
                .filter(opt => opt && typeof opt === 'object' && typeof opt.text === 'string');

            if (mappedOptions.length < 2) return null;

            const firstCorrectIdx = mappedOptions.findIndex(o => Boolean(o.isCorrect));
            const normalizedCorrectIdx = firstCorrectIdx >= 0 ? firstCorrectIdx : 0;
            const optionTexts = mappedOptions.map(o => o.text);
            const rationaleText = typeof mappedOptions[normalizedCorrectIdx].rationale === 'string'
                ? mappedOptions[normalizedCorrectIdx].rationale
                : (typeof rawQ.explanation === 'string' ? rawQ.explanation : '');

            return {
                question: rawQ.question,
                options: optionTexts,
                ansHash: hashAnswer(rawQ.question, optionTexts[normalizedCorrectIdx]),
                expEnc: encodeExplanation(rationaleText)
            };
        };

        const sanitizeQuestionsForExport = (questions) => {
            return (Array.isArray(questions) ? questions : [])
                .map(normalizeQuestion)
                .filter(Boolean)
                .map(q => ({
                    question: q.question,
                    options: [...q.options],
                    ansHash: q.ansHash,
                    expEnc: q.expEnc
                }));
        };

        const normalizeModule = (rawMod, idx) => {
            if (!rawMod || typeof rawMod !== 'object') return null;
            if (typeof rawMod.id !== 'string' || !rawMod.id.trim()) return null;
            if (typeof rawMod.title !== 'string') return null;
            if (!Array.isArray(rawMod.questions)) return null;

            const normalizedQuestions = rawMod.questions.map(normalizeQuestion).filter(Boolean);
            if (rawMod.questions.length > 0 && normalizedQuestions.length === 0) return null;

            return {
                id: rawMod.id.trim(),
                title: rawMod.title.trim() || `Модуль ${idx + 1}`,
                icon: typeof rawMod.icon === 'string' && rawMod.icon.trim() ? rawMod.icon : 'layers',
                color: typeof rawMod.color === 'string' && rawMod.color.trim() ? rawMod.color : 'text-[#133863]',
                bgColor: typeof rawMod.bgColor === 'string' && rawMod.bgColor.trim() ? rawMod.bgColor : 'bg-[#eef3f8]',
                isHidden: Boolean(rawMod.isHidden),
                questionCount: normalizedQuestions.length,
                file: typeof rawMod.file === 'string' && rawMod.file.trim() ? rawMod.file.trim() : null,
                questions: normalizedQuestions,
                isLoaded: true
            };
        };

        const buildInitialQuizData = () => {
            const manifest = Array.isArray(window.QUIZ_MANIFEST) ? window.QUIZ_MANIFEST : [];
            return manifest
                .filter(mod => mod && typeof mod.id === 'string' && mod.id.trim())
                .map((mod, idx) => {
                    const id = mod.id.trim();
                    const preloaded = window.QUIZ_MODULES && Array.isArray(window.QUIZ_MODULES[id])
                        ? window.QUIZ_MODULES[id].map(normalizeQuestion).filter(Boolean)
                        : null;
                    return {
                        id,
                        title: typeof mod.title === 'string' && mod.title.trim() ? mod.title.trim() : `Модуль ${idx + 1}`,
                        icon: typeof mod.icon === 'string' && mod.icon.trim() ? mod.icon : 'layers',
                        color: typeof mod.color === 'string' && mod.color.trim() ? mod.color : 'text-[#133863]',
                        bgColor: typeof mod.bgColor === 'string' && mod.bgColor.trim() ? mod.bgColor : 'bg-[#eef3f8]',
                        isHidden: Boolean(mod.isHidden),
                        questionCount: preloaded ? preloaded.length : (typeof mod.questionCount === 'number' ? mod.questionCount : 0),
                        file: typeof mod.file === 'string' && mod.file.trim() ? mod.file.trim() : `data/mod_${id}.js`,
                        questions: preloaded ? preloaded : [],
                        isLoaded: Boolean(preloaded)
                    };
                });
        };

        const loadModuleScript = (mod) => {
            if (!mod || !mod.id) return Promise.resolve([]);
            if (mod.isLoaded) return Promise.resolve(mod.questions || []);

            window.QUIZ_MODULES = window.QUIZ_MODULES || {};
            if (Array.isArray(window.QUIZ_MODULES[mod.id])) {
                return Promise.resolve(window.QUIZ_MODULES[mod.id].map(normalizeQuestion).filter(Boolean));
            }

            if (!mod.file) {
                return Promise.resolve([]);
            }

            if (moduleScriptPromises.has(mod.id)) {
                return moduleScriptPromises.get(mod.id);
            }

            const promise = new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = mod.file;
                script.async = true;
                script.dataset.quizModuleId = mod.id;

                script.onload = () => {
                    moduleScriptPromises.delete(mod.id);
                    const loaded = window.QUIZ_MODULES && window.QUIZ_MODULES[mod.id];
                    if (Array.isArray(loaded)) {
                        resolve(loaded.map(normalizeQuestion).filter(Boolean));
                    } else {
                        script.remove();
                        reject(new Error(`Модуль "${mod.id}" не містить коректних даних.`));
                    }
                };

                script.onerror = () => {
                    moduleScriptPromises.delete(mod.id);
                    script.remove();
                    reject(new Error(`Не вдалося завантажити файл модуля: ${mod.file}`));
                };

                document.head.appendChild(script);
            });

            moduleScriptPromises.set(mod.id, promise);
            return promise;
        };

        const getIconComponent = (iconName, className) => {
            switch(iconName) {
                case 'book': return <BookOpenIcon className={className} />;
                case 'users': return <UsersIcon className={className} />;
                case 'file-text': return <FileTextIcon className={className} />;
                case 'shield': return <ShieldIcon className={className} />;
                case 'monitor': return <MonitorIcon className={className} />;
                case 'layers': return <LayersIcon className={className} />;
                default: return <BookOpenIcon className={className} />;
            }
        };

        // Ізольований компонент таймера: запобігає щосекундному ререндеру всього <App />
        const QuizTimer = memo(({ initialSeconds, onTimeUp }) => {
            const [timeLeft, setTimeLeft] = useState(initialSeconds);
            const onTimeUpRef = useRef(onTimeUp);
            const hasFiredRef = useRef(false);

            useEffect(() => {
                onTimeUpRef.current = onTimeUp;
            }, [onTimeUp]);

            useEffect(() => {
                setTimeLeft(initialSeconds);
                hasFiredRef.current = false;
                const endTime = Date.now() + initialSeconds * 1000;

                const timer = setInterval(() => {
                    const remaining = Math.max(0, Math.round((endTime - Date.now()) / 1000));
                    setTimeLeft(remaining);
                    if (remaining <= 0) {
                        clearInterval(timer);
                        if (!hasFiredRef.current) {
                            hasFiredRef.current = true;
                            onTimeUpRef.current();
                        }
                    }
                }, 1000);

                return () => clearInterval(timer);
            }, [initialSeconds]);

            return (
                <div className={`flex items-center gap-2 px-3 sm:px-4 py-2 rounded font-bold text-base sm:text-lg transition-colors border shrink-0 ${timeLeft <= 180 ? 'bg-red-50 border-red-200 text-red-600 dark:bg-red-950/60 dark:border-red-800 dark:text-red-300 animate-pulse' : 'bg-[#f4f6f9] border-slate-200 text-[#133863] dark:bg-[#0B1320] dark:border-slate-700 dark:text-slate-100'}`}>
                    <ClockIcon className="w-5 h-5" />
                    <span>{formatTime(timeLeft)}</span>
                </div>
            );
        });

        // Мемоізована картка питання в Адмін-панелі для швидкого рендеру на великих базах (5000+ питань)
        const AdminQuestionCard = memo(({ q, qIdx, modIdx, onUpdate, onDeleteRequest }) => {
            const foundCorrectIdx = findCorrectOptionIndex(q.question, q.options, q.ansHash);
            const correctIdx = foundCorrectIdx >= 0 ? foundCorrectIdx : 0;
            const decodedExplanation = useMemo(() => decodeExplanation(q.expEnc), [q.expEnc]);

            return (
                <div className="bg-white dark:bg-[#131E32] p-4 sm:p-5 rounded-md border border-gray-200 dark:border-slate-700 shadow-sm relative group transition-colors">
                    <button
                        type="button"
                        onClick={() => onDeleteRequest(modIdx, qIdx)}
                        aria-label={`Видалити запитання ${qIdx + 1}`}
                        title="Видалити запитання"
                        className="absolute top-3 right-3 sm:top-4 sm:right-4 p-1.5 text-gray-400 hover:text-red-500 dark:text-slate-400 dark:hover:text-red-400 opacity-100 sm:opacity-0 sm:group-hover:opacity-100 focus:opacity-100 transition-all"
                    >
                        <Trash2Icon className="w-5 h-5" />
                    </button>
                    <div className="mb-4 pr-10">
                        <label className="block text-xs font-bold text-gray-400 dark:text-slate-400 uppercase tracking-wider mb-1">Запитання {qIdx + 1}</label>
                        <textarea
                            className="w-full p-3 border border-gray-300 dark:border-slate-600 rounded font-semibold text-gray-800 dark:text-white bg-white dark:bg-[#0B1320] text-sm sm:text-base focus:border-[#133863] dark:focus:border-[#F7D622] outline-none resize-none transition-colors"
                            rows="2"
                            value={q.question}
                            onChange={(e) => onUpdate(modIdx, qIdx, 'question', e.target.value)}
                        />
                    </div>
                    <div className="grid grid-cols-1 gap-3">
                        {q.options.map((optText, oIdx) => {
                            const isOptCorrect = oIdx === correctIdx;
                            return (
                                <div key={oIdx} className={`p-3 rounded border ${isOptCorrect ? 'border-emerald-300 bg-emerald-50 dark:border-emerald-700/70 dark:bg-emerald-950/40' : 'border-gray-200 bg-gray-50 dark:border-slate-700 dark:bg-[#0B1320]/60'} flex gap-3 items-start`}>
                                    <input
                                        type="radio"
                                        name={`correct-${modIdx}-${qIdx}`}
                                        checked={isOptCorrect}
                                        onChange={() => onUpdate(modIdx, qIdx, 'correct', oIdx)}
                                        className="mt-1.5 w-4 h-4 accent-[#133863] dark:accent-[#F7D622] shrink-0"
                                    />
                                    <div className="flex-1 space-y-2 min-w-0">
                                        <input
                                            className="w-full p-2 border border-gray-300 dark:border-slate-600 rounded bg-white dark:bg-[#0B1320] text-slate-800 dark:text-white text-sm focus:border-[#133863] dark:focus:border-[#F7D622] outline-none transition-colors font-medium"
                                            value={optText}
                                            placeholder="Текст відповіді"
                                            onChange={(e) => onUpdate(modIdx, qIdx, 'optionText', e.target.value, oIdx)}
                                        />
                                        {isOptCorrect && (
                                            <textarea
                                                className="w-full p-2 border border-emerald-300 dark:border-emerald-700 rounded bg-white dark:bg-[#0B1320] text-slate-800 dark:text-slate-100 text-xs focus:border-emerald-500 outline-none resize-none transition-colors font-medium"
                                                value={decodedExplanation}
                                                placeholder="Норма закону та юридичне обґрунтування"
                                                rows="2"
                                                onChange={(e) => onUpdate(modIdx, qIdx, 'explanation', e.target.value)}
                                            />
                                        )}
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        });

        const App = () => {
            const [isDarkMode, setIsDarkMode] = useState(() => {
                try {
                    return localStorage.getItem('bpd_theme') === 'dark';
                } catch (e) {
                    return false;
                }
            });

            useEffect(() => {
                const rootEl = document.documentElement;
                if (isDarkMode) {
                    rootEl.classList.add('dark');
                } else {
                    rootEl.classList.remove('dark');
                }
                try {
                    localStorage.setItem('bpd_theme', isDarkMode ? 'dark' : 'light');
                } catch (e) {}
            }, [isDarkMode]);

            const toggleDarkMode = useCallback(() => {
                setIsDarkMode(prev => !prev);
            }, []);

            const [quizData, setQuizData] = useState(buildInitialQuizData);
            const [isAdmin, setIsAdmin] = useState(false);
            const [showLogin, setShowLogin] = useState(false);
            const [password, setPassword] = useState('');
            const [adminActiveTab, setAdminActiveTab] = useState(0);
            const [adminSearchQuery, setAdminSearchQuery] = useState('');
            const [visibleQuestionsCount, setVisibleQuestionsCount] = useState(ADMIN_PAGE_SIZE);

            const [activeScreen, setActiveScreen] = useState('menu'); 
            const [currentQuizMeta, setCurrentQuizMeta] = useState(null);
            const [sessionQuestions, setSessionQuestions] = useState([]);
            const [sessionResults, setSessionResults] = useState([]);
            const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
            const [userAnswers, setUserAnswers] = useState([]); 
            const [score, setScore] = useState(0);
            
            const [userName, setUserName] = useState('');
            const [pendingQuizId, setPendingQuizId] = useState(null);
            const [currentDate, setCurrentDate] = useState('');
            const [syncStatus, setSyncStatus] = useState('idle');

            // Стани динамічного завантаження (Lazy Loading)
            const [loadingModuleIds, setLoadingModuleIds] = useState({});
            const [moduleLoadErrors, setModuleLoadErrors] = useState({});
            const [isPreparingQuiz, setIsPreparingQuiz] = useState(false);
            const [isExporting, setIsExporting] = useState(false);

            // Сповіщення
            const [toast, setToast] = useState(null);
            const [deleteConfirm, setDeleteConfirm] = useState(null);

            const toastTimerRef = useRef(null);
            const isFinishingRef = useRef(false);
            const preQuizRequestRef = useRef(0);
            const quizDataRef = useRef(quizData);
            quizDataRef.current = quizData;

            const showToast = useCallback((message, type = 'info') => {
                if (toastTimerRef.current) {
                    clearTimeout(toastTimerRef.current);
                }
                setToast({ message, type });
                toastTimerRef.current = setTimeout(() => {
                    setToast(null);
                    toastTimerRef.current = null;
                }, 4000);
            }, []);

            useEffect(() => {
                return () => {
                    if (toastTimerRef.current) {
                        clearTimeout(toastTimerRef.current);
                    }
                };
            }, []);

            // Динамічне паралельне завантаження одного або кількох модулів за ID
            const ensureModulesLoaded = useCallback(async (moduleIds) => {
                const uniqueIds = Array.from(new Set((moduleIds || []).filter(Boolean)));
                const questionsById = new Map();
                const toLoad = [];
                const currentData = quizDataRef.current;

                uniqueIds.forEach(id => {
                    const mod = currentData.find(m => m.id === id);
                    if (!mod) return;
                    if (mod.isLoaded) {
                        questionsById.set(id, mod.questions || []);
                    } else {
                        toLoad.push(mod);
                    }
                });

                if (toLoad.length === 0) {
                    return { questionsById, failedIds: [] };
                }

                const toLoadIds = toLoad.map(m => m.id);
                setLoadingModuleIds(prev => {
                    const next = { ...prev };
                    toLoadIds.forEach(id => { next[id] = true; });
                    return next;
                });
                setModuleLoadErrors(prev => {
                    const next = { ...prev };
                    toLoadIds.forEach(id => { delete next[id]; });
                    return next;
                });

                const results = await Promise.all(
                    toLoad.map(async (mod) => {
                        try {
                            const loadedQuestions = await loadModuleScript(mod);
                            return { id: mod.id, questions: loadedQuestions, error: null };
                        } catch (err) {
                            return {
                                id: mod.id,
                                questions: null,
                                error: err && err.message ? err.message : `Помилка завантаження модуля "${mod.title}"`
                            };
                        }
                    })
                );

                const loadedMap = new Map();
                const failedErrors = {};
                const failedIds = [];

                results.forEach(res => {
                    if (res.error) {
                        failedIds.push(res.id);
                        failedErrors[res.id] = res.error;
                    } else {
                        const qs = Array.isArray(res.questions) ? res.questions : [];
                        loadedMap.set(res.id, qs);
                        questionsById.set(res.id, qs);
                    }
                });

                setLoadingModuleIds(prev => {
                    const next = { ...prev };
                    toLoadIds.forEach(id => { delete next[id]; });
                    return next;
                });

                if (failedIds.length > 0) {
                    setModuleLoadErrors(prev => ({ ...prev, ...failedErrors }));
                }

                if (loadedMap.size > 0) {
                    setQuizData(prevData => prevData.map(mod => {
                        if (!loadedMap.has(mod.id) || mod.isLoaded) return mod;
                        const qs = loadedMap.get(mod.id);
                        return {
                            ...mod,
                            questions: qs,
                            questionCount: qs.length,
                            isLoaded: true
                        };
                    }));
                }

                return { questionsById, failedIds };
            }, []);

            // Античит: блокування контекстного меню, копіювання/вставки, інспектора та гарячих клавіш (включно з кириличною розкладкою)
            useEffect(() => {
                if (activeScreen !== 'quiz') return;

                const handleContextMenu = (e) => e.preventDefault();
                const handleClipboard = (e) => e.preventDefault();
                const handleKeyDown = (e) => {
                    const key = (e.key || '').toLowerCase();
                    const code = e.code || '';

                    if (key === 'f12' || code === 'F12') {
                        e.preventDefault();
                        return;
                    }

                    if (e.ctrlKey || e.metaKey) {
                        if (
                            ['c', 'v', 'a', 'p', 's', 'u'].includes(key) ||
                            ['KeyC', 'KeyV', 'KeyA', 'KeyP', 'KeyS', 'KeyU'].includes(code)
                        ) {
                            e.preventDefault();
                            return;
                        }
                        if (e.shiftKey || e.altKey) {
                            if (
                                ['i', 'j', 'c', 'u'].includes(key) ||
                                ['KeyI', 'KeyJ', 'KeyC', 'KeyU'].includes(code)
                            ) {
                                e.preventDefault();
                            }
                        }
                    }
                };

                document.addEventListener('contextmenu', handleContextMenu);
                document.addEventListener('keydown', handleKeyDown);
                document.addEventListener('copy', handleClipboard);
                document.addEventListener('cut', handleClipboard);
                document.addEventListener('paste', handleClipboard);

                return () => {
                    document.removeEventListener('contextmenu', handleContextMenu);
                    document.removeEventListener('keydown', handleKeyDown);
                    document.removeEventListener('copy', handleClipboard);
                    document.removeEventListener('cut', handleClipboard);
                    document.removeEventListener('paste', handleClipboard);
                };
            }, [activeScreen]);

            const initiateQuiz = (quizId) => {
                preQuizRequestRef.current += 1;
                setIsPreparingQuiz(false);
                setPendingQuizId(quizId);
                setActiveScreen('preQuiz');

                if (quizId !== 'combined') {
                    const targetMod = quizDataRef.current.find(q => q.id === quizId);
                    if (targetMod && !targetMod.isLoaded) {
                        ensureModulesLoaded([quizId]).then(({ failedIds }) => {
                            if (failedIds.includes(quizId)) {
                                showToast("Не вдалося завантажити запитання модуля. Перевірте з'єднання та спробуйте ще раз.", "error");
                            }
                        });
                    }
                }
            };

            const pendingQuizTitle = useMemo(() => {
                if (!pendingQuizId) return '';
                if (pendingQuizId === 'combined') return "Об'єднаний іспит (Всі активні теми)";
                return quizData.find(q => q.id === pendingQuizId)?.title || '';
            }, [pendingQuizId, quizData]);

            const confirmStartQuiz = async () => {
                if (isPreparingQuiz) return;

                const trimmedName = userName.trim();
                if (!trimmedName) {
                    showToast("Будь ласка, введіть ваше ПІБ для початку іспиту.", "error");
                    return;
                }

                const reqId = preQuizRequestRef.current;
                let pool = [];
                let title = "";

                if (pendingQuizId === 'combined') {
                    const activeModules = quizDataRef.current.filter(q => !q.isHidden);
                    if (activeModules.length === 0) {
                        showToast("Немає жодного активного модуля для об'єднаного іспиту.", "error");
                        return;
                    }

                    setIsPreparingQuiz(true);
                    let loadRes;
                    try {
                        loadRes = await ensureModulesLoaded(activeModules.map(m => m.id));
                    } finally {
                        setIsPreparingQuiz(false);
                    }

                    if (preQuizRequestRef.current !== reqId) return;
                    if (loadRes.failedIds.length > 0) {
                        showToast("Не вдалося завантажити всі активні модулі. Перевірте з'єднання та спробуйте ще раз.", "error");
                        return;
                    }

                    activeModules.forEach(m => {
                        const modQuestions = loadRes.questionsById.get(m.id) || [];
                        pool.push(...modQuestions);
                    });
                    title = "Об'єднаний іспит (Всі теми)";
                } else {
                    const quiz = quizDataRef.current.find(q => q.id === pendingQuizId);
                    if (!quiz) {
                        showToast("Обраний модуль не знайдено.", "error");
                        setActiveScreen('menu');
                        return;
                    }

                    setIsPreparingQuiz(true);
                    let loadRes;
                    try {
                        loadRes = await ensureModulesLoaded([quiz.id]);
                    } finally {
                        setIsPreparingQuiz(false);
                    }

                    if (preQuizRequestRef.current !== reqId) return;
                    if (loadRes.failedIds.length > 0) {
                        showToast("Не вдалося завантажити запитання модуля. Спробуйте ще раз.", "error");
                        return;
                    }

                    pool = [...(loadRes.questionsById.get(quiz.id) || [])];
                    title = quiz.title;
                }

                if (pool.length === 0) {
                    showToast("У цьому модулі ще немає питань! Завантажте їх через адмін-панель.", "error");
                    return;
                }

                const shuffledPool = shuffleArray(pool);
                const maxQuestions = Math.min(MAX_EXAM_QUESTIONS, shuffledPool.length);
                const selectedQuestions = shuffledPool.slice(0, maxQuestions);

                const questionsWithShuffledOptions = selectedQuestions.map(q => ({
                    question: q.question,
                    options: shuffleArray(q.options),
                    ansHash: q.ansHash,
                    expEnc: q.expEnc
                }));

                isFinishingRef.current = false;
                setSyncStatus('idle');
                setUserName(trimmedName);
                setCurrentQuizMeta({ id: pendingQuizId, title: title });
                setSessionResults([]);
                setSessionQuestions(questionsWithShuffledOptions);
                setUserAnswers(new Array(selectedQuestions.length).fill(null));
                setCurrentQuestionIndex(0);
                setActiveScreen('quiz');
                
                const today = new Date();
                setCurrentDate(today.toLocaleDateString('uk-UA', { day: '2-digit', month: 'long', year: 'numeric' }) + ' ' + today.toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' }));
            };

            const handleOptionSelect = (index) => {
                setUserAnswers(prev => {
                    const next = [...prev];
                    next[currentQuestionIndex] = index;
                    return next;
                });
            };

            const sendToGoogleSheets = async (finalScore, totalQuestions, percentage, errorsData, isTimeOut = false) => {
                if (!GOOGLE_SHEETS_WEBHOOK_URL || GOOGLE_SHEETS_WEBHOOK_URL.includes("ВАШ_WEBHOOK_URL_ТУТ")) return;

                if (typeof navigator !== 'undefined' && navigator.onLine === false) {
                    setSyncStatus('offline');
                    if (!isTimeOut) {
                        showToast("Офлайн-режим: Результати збережено локально на екрані.", "info");
                    }
                    return;
                }

                setSyncStatus('sending');
                const payload = {
                    date: new Date().toLocaleString('uk-UA'),
                    name: userName.trim(),
                    module: currentQuizMeta?.title || '',
                    score: `${finalScore}/${totalQuestions}`,
                    percentage: `${percentage}%`,
                    errors: JSON.stringify(errorsData)
                };

                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 4000);

                try {
                    await fetch(GOOGLE_SHEETS_WEBHOOK_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload),
                        signal: controller.signal
                    });
                    setSyncStatus('sent');
                    if (!isTimeOut) {
                        showToast("Результати успішно надіслані в систему!", "success");
                    }
                } catch (e) {
                    console.warn("Помилка зв'язку з сервером", e);
                    setSyncStatus('offline');
                    if (!isTimeOut) {
                        showToast("Офлайн-режим: Результати збережено локально на екрані.", "info");
                    }
                } finally {
                    clearTimeout(timeoutId);
                }
            };

            const handleFinishTest = useCallback((isTimeOut = false) => {
                if (isFinishingRef.current || sessionQuestions.length === 0) return;
                isFinishingRef.current = true;

                let finalScore = 0;
                const errorsData = [];
                const resolvedDossier = sessionQuestions.map((q, idx) => {
                    const uAnsIdx = userAnswers[idx];
                    const skipped = uAnsIdx === null || uAnsIdx === undefined;
                    const selectedOptionText = skipped ? '' : (q.options[uAnsIdx] || '');
                    const isCorrect = !skipped && hashAnswer(q.question, selectedOptionText) === q.ansHash;

                    if (isCorrect) {
                        finalScore++;
                    } else {
                        errorsData.push(idx + 1);
                    }

                    const correctIdx = findCorrectOptionIndex(q.question, q.options, q.ansHash);
                    const correctText = correctIdx >= 0 ? q.options[correctIdx] : '';
                    const explanation = decodeExplanation(q.expEnc);

                    return {
                        question: q.question,
                        userAnswerText: skipped ? "Не надано відповіді (час вичерпано)" : selectedOptionText,
                        skipped,
                        isCorrect,
                        correctText,
                        explanation
                    };
                });

                setSessionResults(resolvedDossier);
                setScore(finalScore);
                const percentage = Math.round((finalScore / sessionQuestions.length) * 100);

                if (isTimeOut) {
                    showToast("Час вичерпано! Тестування завершено автоматично.", "error");
                }

                sendToGoogleSheets(finalScore, sessionQuestions.length, percentage, errorsData, isTimeOut);
                setActiveScreen('result');
            }, [sessionQuestions, userAnswers, userName, currentQuizMeta, showToast]);

            const handleTimeUp = useCallback(() => {
                handleFinishTest(true);
            }, [handleFinishTest]);

            const handlePrevQuestion = () => {

            const handleCreateModule = () => {

                setAdminSearchQuery('');

                showToast("Створено порожній модуль! Вкажіть його назву та додайте запитання.", "success");
            };

            const updateQuestion = useCallback((modIdx, qIdx, field, value, optIdx = null) => {
                setQuizData(prevData => {
                    if (!prevData[modIdx] || !prevData[modIdx].questions[qIdx]) return prevData;
                    const newData = [...prevData];
                    const targetMod = { ...newData[modIdx] };
                    const newQuestions = [...targetMod.questions];
                    const oldQ = newQuestions[qIdx];
                    const prevCorrectIdx = findCorrectOptionIndex(oldQ.question, oldQ.options, oldQ.ansHash);
                    const safeCorrectIdx = prevCorrectIdx >= 0 ? prevCorrectIdx : 0;

                    let nextQuestion = oldQ.question;
                    let nextOptions = [...oldQ.options];
                    let nextAnsHash = oldQ.ansHash;
                    let nextExpEnc = oldQ.expEnc;

                    if (field === 'question') {
                        nextQuestion = value;
                        nextAnsHash = hashAnswer(nextQuestion, nextOptions[safeCorrectIdx] ?? '');
                    } else if (field === 'optionText' && optIdx !== null) {
                        nextOptions[optIdx] = value;
                        if (optIdx === safeCorrectIdx) {
                            nextAnsHash = hashAnswer(nextQuestion, value);
                        }
                    } else if (field === 'correct') {
                        const newIdx = Number(value);
                        if (newIdx >= 0 && newIdx < nextOptions.length) {
                            nextAnsHash = hashAnswer(nextQuestion, nextOptions[newIdx]);
                        }
                    } else if (field === 'explanation') {
                        nextExpEnc = encodeExplanation(value);
                    }

                    newQuestions[qIdx] = {
                        question: nextQuestion,
                        options: nextOptions,
                        ansHash: nextAnsHash,
                        expEnc: nextExpEnc
                    };
                    targetMod.questions = newQuestions;
                    newData[modIdx] = targetMod;
                    return newData;
                });
            }, []);

            const handleDeleteRequest = useCallback((modIdx, qIdx) => {
                setDeleteConfirm({ modIdx, qIdx });

            const addNewQuestion = (modIdx) => {
                const newQuestionText = "Текст нового запитання?";
                const newOptions = [
                    "Варіант відповіді 1 (Правильний)",
                    "Варіант відповіді 2",
                    "Варіант відповіді 3",
                    "Варіант відповіді 4"
                ];
                const newQuestion = {
                    question: newQuestionText,
                    options: newOptions,
                    ansHash: hashAnswer(newQuestionText, newOptions[0]),
                    expEnc: encodeExplanation("Юридичне обґрунтування норми закону")
                };

                setQuizData(prevData => {
                    if (!prevData[modIdx]) return prevData;
                    const newData = [...prevData];
                    const nextQuestions = [newQuestion, ...newData[modIdx].questions];
                    newData[modIdx] = {
                        ...newData[modIdx],
                        questions: nextQuestions,
                        questionCount: nextQuestions.length,
                        isLoaded: true
                    };
                    return newData;
                });
                setAdminSearchQuery('');
                showToast("Питання успішно додано!", "success");
            };

            const executeDelete = () => {
                if (!deleteConfirm) return;
                const { modIdx, qIdx } = deleteConfirm;
                setQuizData(prevData => {
                    if (!prevData[modIdx]) return prevData;
                    const newData = [...prevData];
                    const nextQuestions = [...newData[modIdx].questions];
                    nextQuestions.splice(qIdx, 1);
                    newData[modIdx] = {
                        ...newData[modIdx],
                        questions: nextQuestions,
                        questionCount: nextQuestions.length
                    };
                    return newData;
                });
                showToast("Питання видалено", "info");
                setDeleteConfirm(null);
            };

            const handleImportJSON = (e) => {
                const inputEl = e.target;
                const file = inputEl.files && inputEl.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = async (event) => {
                    try {
                        const importedData = JSON.parse(event.target.result);

                        if (Array.isArray(importedData) && importedData.length > 0 && importedData[0] && typeof importedData[0] === 'object' && 'id' in importedData[0] && 'questions' in importedData[0]) {
                            const normalizedModules = importedData.map((mod, idx) => normalizeModule(mod, idx)).filter(Boolean);
                            if (normalizedModules.length === 0 || normalizedModules.length !== importedData.length) {
                                showToast("Помилка структури модулів у JSON. Перевірте поля id, title та questions.", "error");
                                return;
                            }
                            setQuizData(normalizedModules);
                            setModuleLoadErrors({});
                            setAdminActiveTab(0);
                            setAdminSearchQuery('');
                            setVisibleQuestionsCount(ADMIN_PAGE_SIZE);
                            showToast("Усю структуру тестів успішно оновлено!", "success");
                            return;
                        }

                        const rawQuestions = Array.isArray(importedData)
                            ? importedData
                            : (importedData && Array.isArray(importedData.questions) ? importedData.questions : null);

                        if (!rawQuestions || rawQuestions.length === 0) {
                            showToast("Файл порожній або має неправильний формат JSON.", "error");
                            return;
                        }

                        const formattedQuestions = rawQuestions.map(normalizeQuestion).filter(Boolean);
                        if (formattedQuestions.length === 0) {
                            showToast("У файлі не знайдено жодного коректного питання (потрібні question та мінімум 2 options).", "error");
                            return;
                        }

                        const currentData = quizDataRef.current;
                        const targetTabIdx = currentData[adminActiveTab] ? adminActiveTab : 0;
                        const targetMod = currentData[targetTabIdx];
                        if (!targetMod) {
                            showToast("Спочатку створіть хоча б один модуль.", "error");
                            return;
                        }

                        if (!targetMod.isLoaded && targetMod.file) {
                            const { failedIds } = await ensureModulesLoaded([targetMod.id]);
                            if (failedIds.length > 0) {
                                showToast("Не вдалося завантажити поточні питання модуля перед імпортом.", "error");
                                return;
                            }
                        }

                        setQuizData(prevData => {
                            const idx = prevData.findIndex(m => m.id === targetMod.id);
                            if (idx < 0) return prevData;
                            const newData = [...prevData];
                            const nextQuestions = [...newData[idx].questions, ...formattedQuestions];
                            newData[idx] = {
                                ...newData[idx],
                                questions: nextQuestions,
                                questionCount: nextQuestions.length,
                                isLoaded: true
                            };
                            return newData;
                        });

                        const skippedCount = rawQuestions.length - formattedQuestions.length;
                        if (skippedCount > 0) {
                            showToast(`Додано ${formattedQuestions.length} питань (${skippedCount} некоректних пропущено).`, "info");
                        } else {
                            showToast(`Успішно додано ${formattedQuestions.length} питань!`, "success");
                        }
                    } catch (error) {
                        showToast("Помилка читання файлу. Перевірте валідність JSON.", "error");
                        console.error(error);
                    } finally {
                        inputEl.value = '';
                    }
                };
                reader.onerror = () => {
                    showToast("Не вдалося прочитати вибраний файл.", "error");
                    inputEl.value = '';
                };
                reader.readAsText(file);
            };

            const handleExportJSON = async () => {
                if (isExporting) return;
                setIsExporting(true);
                try {
                    const currentData = quizDataRef.current;
                    const { questionsById, failedIds } = await ensureModulesLoaded(currentData.map(m => m.id));
                    if (failedIds.length > 0) {
                        showToast("Не вдалося завантажити всі модулі для експорту. Спробуйте ще раз.", "error");

                            questionCount: safeQs.length,
                            file: mod.file || `data/mod_${mod.id}.js`,
                            questions: safeQs
                        };

                const targetMod = currentData[targetTabIdx];

            const handleCompileHTML = async () => {

                            icon: mod.icon,

                    const scriptContent = (scriptElement.textContent || scriptElement.innerHTML).replace(/^\n+|\s+$/g, '');
                    const styleElement = document.getElementById('app-styles');
                    const styleContent = styleElement ? styleElement.textContent : `
        body {
            font-family: 'Montserrat', sans-serif;
        }
        /* Античит: Заборона виділення тексту під час тестування */
        .exam-mode-active {
            user-select: none;
            -webkit-user-select: none;

            -ms-user-select: none;
        }
        @media print {

                                        />
                                    </div>
                                    <h1 className="text-2xl sm:text-3xl font-black text-[#133863] dark:text-white print-light-heading uppercase tracking-widest mb-2">Досьє результатів тестування</h1>
                                    <h2 className="text-base sm:text-lg font-bold text-slate-600 dark:text-slate-300 print-light-subtext">{currentQuizMeta?.title}</h2>
                                </div>
                                
                                <div className="flex flex-col md:flex-row justify-between items-center bg-[#f4f6f9] dark:bg-[#131E32] border border-slate-200 dark:border-slate-700 print-light-summary p-5 sm:p-8 rounded-md mb-8 gap-6 transition-colors">
                                    <div className="text-center md:text-left">
                                        <p className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Юрист:</p>
                                        <p className="text-xl sm:text-2xl font-black text-[#133863] dark:text-white print-light-heading uppercase break-words">{userName}</p>
                                        <p className="text-sm font-semibold text-slate-500 dark:text-slate-300 print-light-subtext mt-2">Дата: {currentDate}</p>
                                        {syncStatus !== 'idle' && (
                                            <span className={`inline-block mt-2 text-xs font-bold px-2.5 py-1 rounded ${syncStatus === 'sent' ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950/60 dark:text-emerald-300' : syncStatus === 'offline' ? 'bg-amber-100 text-amber-800 dark:bg-amber-950/60 dark:text-amber-300' : 'bg-blue-100 text-[#133863] dark:bg-blue-950/60 dark:text-blue-200'}`}>
                                                {syncStatus === 'sent' ? 'Результати надіслано в таблицю' : syncStatus === 'offline' ? 'Офлайн-режим: збережено локально' : 'Надсилання результатів...'}
                                            </span>
                                        )}
                                    </div>
                                    
                                    <div className="flex items-center justify-center gap-6 sm:gap-8 bg-white dark:bg-[#0B1320] p-4 rounded border border-slate-200 dark:border-slate-700 print-light-card w-full md:w-auto transition-colors">
                                        <div className="text-center">
                                            <p className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Ваш бал</p>
                                            <p className="text-3xl sm:text-4xl font-black text-[#133863] dark:text-white print-light-heading">{score}<span className="text-lg sm:text-xl text-slate-300 dark:text-slate-500">/{sessionQuestions.length}</span></p>
                                        </div>
                                        <div className="w-px h-12 bg-slate-200 dark:bg-slate-700"></div>
                                        <div className="text-center">
                                            <p className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Успішність</p>
                                            <p className={`text-3xl sm:text-4xl font-black ${resultPercentage >= 80 ? 'text-emerald-600 dark:text-emerald-400' : 'text-red-500 dark:text-red-400'}`}>{resultPercentage}%</p>
                                        </div>
                                    </div>
                                </div>

                                <h3 className="text-lg sm:text-xl font-bold text-[#133863] dark:text-white print-light-heading mb-6 uppercase tracking-wide border-l-4 border-[#F7D622] pl-3">Детальний розбір відповідей:</h3>
                                <div className="space-y-4">
                                    {sessionResults.map((item, idx) => {
                                        const isCorrect = item.isCorrect;

                                        return (
                                            <div key={idx} className="p-4 sm:p-6 border-l-4 bg-white dark:bg-[#131E32] border-t border-r border-b border-slate-100 dark:border-slate-700 print-border print-break-inside-avoid print-light-card transition-colors" style={{ borderLeftColor: isCorrect ? '#10b981' : '#ef4444' }}>
                                                <p className="font-bold text-base text-slate-800 dark:text-slate-100 print-light-heading mb-4 leading-relaxed">
                                                    <span className="text-slate-400 mr-2">#{idx + 1}.</span> {item.question}
                                                </p>
                                                
                                                <div className="mb-3">
                                                    <span className="font-bold block text-xs uppercase mb-1 text-slate-500 dark:text-slate-400 print-light-subtext">Ваша відповідь:</span>
                                                    <p className={`font-semibold text-sm p-3 rounded ${isCorrect ? 'bg-emerald-50 text-emerald-800 border border-emerald-100 dark:bg-emerald-950/50 dark:text-emerald-300 dark:border-emerald-800/60 print-light-correct' : 'bg-red-50 text-red-800 border border-red-100 dark:bg-red-950/50 dark:text-red-300 dark:border-red-800/60 print-light-wrong'}`}>
                                                        {item.userAnswerText}
                                                        <span className="ml-2 font-black">{isCorrect ? '(✓ Вірно)' : '(✗ Помилка)'}</span>
                                                    </p>
                                                </div>

                                                {!isCorrect && (
                                                    <div className="mb-3">
                                                        <span className="font-bold block text-xs uppercase mb-1 text-emerald-600 dark:text-emerald-400">Правильна відповідь:</span>
                                                        <p className="font-semibold text-sm p-3 rounded bg-emerald-50 text-emerald-800 border border-emerald-100 dark:bg-emerald-950/50 dark:text-emerald-300 dark:border-emerald-800/60 print-light-correct">
                                                            {item.correctText}
                                                        </p>
                                                    </div>
                                                )}

                                                <div className="mt-4 pt-3 border-t border-slate-100 dark:border-slate-700">
                                                    <span className="font-bold block text-xs uppercase mb-1 text-[#133863] dark:text-[#F7D622] print-light-heading">Обґрунтування (Норма):</span>
                                                    <p className="text-slate-600 dark:text-slate-300 print-light-subtext text-sm leading-relaxed font-medium">
                                                        {item.explanation}
                                                    </p>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const container = document.getElementById('app');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>

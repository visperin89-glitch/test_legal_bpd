                                                    <div className="flex gap-2 w-full sm:w-auto">
                                                        <button
                                                            type="button"
                                                            onClick={() => setVisibleQuestionsCount(prev => prev + ADMIN_PAGE_SIZE)}
                                                            className="flex-1 sm:flex-none px-4 py-2 bg-white border border-slate-300 hover:border-[#133863] text-[#133863] rounded text-xs font-bold transition-colors"
                                                        >
                                                            Показати ще {Math.min(ADMIN_PAGE_SIZE, filteredAdminQuestions.length - visibleQuestionsCount)}
                                                        </button>
                                                        <button
                                                            type="button"
                                                            onClick={() => setVisibleQuestionsCount(filteredAdminQuestions.length)}
                                                            className="flex-1 sm:flex-none px-4 py-2 bg-[#133863] hover:bg-[#0A2240] text-white rounded text-xs font-bold transition-colors"
                                                        >
                                                            Показати всі ({filteredAdminQuestions.length})
                                                        </button>
                                                    </div>
                                                </div>
                                            )}
                                            
                                            <div className="flex flex-col sm:flex-row gap-3 sm:gap-4 mt-6 sm:mt-8 pt-6 border-t">
                                                <button
                                                    type="button"
                                                    onClick={() => addNewQuestion(effectiveAdminTab)}
                                                    disabled={isCurrentAdminLoading || (!currentAdminModule.isLoaded && Boolean(currentAdminModule.file))}
                                                    className="flex-1 py-3 px-4 border-2 border-dashed border-gray-300 rounded-md text-gray-600 text-sm font-bold hover:bg-gray-50 hover:text-[#133863] disabled:opacity-50 disabled:cursor-not-allowed transition-all flex items-center justify-center gap-2"
                                                >
                                                    <PlusIcon className="w-5 h-5 shrink-0" /> Створити питання вручну
                                                </button>
                                                
                                                <label className={`flex-1 py-3 px-4 border-2 border-dashed border-emerald-300 rounded-md text-emerald-700 text-sm font-bold hover:bg-emerald-50 transition-all flex items-center justify-center gap-2 ${isCurrentAdminLoading ? 'opacity-50 cursor-not-allowed' : 'cursor-pointer'}`}>
                                                    <UploadIcon className="w-5 h-5 shrink-0" /> Імпорт з файлу (JSON)
                                                    <input type="file" accept=".json" disabled={isCurrentAdminLoading} className="hidden" onChange={handleImportJSON} />
                                                </label>

                                                <button type="button" onClick={handleExportJSON} disabled={isExporting} className="flex-1 py-3 px-4 border-2 border-dashed border-indigo-300 rounded-md text-indigo-700 text-sm font-bold hover:bg-indigo-50 disabled:opacity-50 transition-all flex items-center justify-center gap-2">
                                                    {isExporting ? <SpinnerIcon className="w-5 h-5 shrink-0" /> : <DownloadIcon className="w-5 h-5 shrink-0" />} Експортувати базу (JSON)
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        ) : (
                            <div>
                                <header className="bg-[#133863] border-b-4 border-[#F7D622] text-white pt-14 pb-10 sm:py-12 px-4 sm:px-6 shadow-md mb-8 sm:mb-10 text-center relative overflow-hidden">
                                    <button type="button" onClick={() => setShowLogin(true)} aria-label="Вхід для адміністратора" title="Вхід для адміністратора" className="absolute top-4 left-4 sm:top-6 sm:left-6 p-2 hover:bg-white/10 rounded-md transition-colors">
                                        <ShieldIcon className="text-[#F7D622] w-6 h-6" />
                                    </button>
                                    <div className="max-w-5xl mx-auto flex flex-col items-center relative z-10">
                                        <div className="mb-4">
                                            <h1 className="text-2xl sm:text-3xl md:text-4xl font-black mb-1 tracking-wider uppercase">Система надання</h1>
                                            <h2 className="text-lg sm:text-xl md:text-2xl font-semibold tracking-wide text-blue-100">безоплатної правничої допомоги</h2>
                                        </div>
                                        <div className="w-16 h-1 bg-[#F7D622] my-3 sm:my-4 rounded"></div>
                                        <h3 className="text-xl sm:text-2xl font-bold">Портал тестування юристів</h3>
                                    </div>
                                </header>
                                
                                <div className="max-w-5xl mx-auto px-4 sm:px-6 pb-12">
                                    <h2 className="text-lg sm:text-xl font-bold text-[#133863] mb-6 text-center uppercase tracking-wide">Оберіть модуль тестування:</h2>
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 sm:gap-6">
                                        
                                        <div onClick={() => initiateQuiz('combined')} className="flex flex-col bg-[#F7D622] rounded-md p-6 shadow-sm border border-[#e5c61a] hover:shadow-md cursor-pointer group transition-all">
                                            <div className="w-12 h-12 rounded flex items-center justify-center mb-6 bg-[#133863] text-white shadow-sm"><LayersIcon className="w-6 h-6" /></div>
                                            <h3 className="text-lg font-black text-[#133863] mb-6 uppercase tracking-wide">Об'єднаний іспит</h3>
                                            <div className="flex items-center text-sm font-bold text-[#133863] bg-white/50 border border-[#e5c61a] p-3 rounded mt-auto">
                                                <span>Почати тестування</span><ArrowRightIcon className="w-5 h-5 ml-auto group-hover:translate-x-1 transition-transform" />
                                            </div>
                                        </div>

                                        {quizData.filter(quiz => !quiz.isHidden).map((quiz) => (
                                            <div key={quiz.id} onClick={() => initiateQuiz(quiz.id)} className="flex flex-col bg-white rounded-md p-6 shadow-sm border border-slate-200 hover:shadow-md hover:border-[#133863] cursor-pointer group transition-all">
                                                <div className={`w-12 h-12 rounded flex items-center justify-center mb-6 ${quiz.bgColor} ${quiz.color}`}>{getIconComponent(quiz.icon, "w-6 h-6")}</div>
                                                <h3 className="text-lg font-bold text-slate-800 mb-6 group-hover:text-[#133863] transition-colors leading-snug">{quiz.title}</h3>
                                                <div className="flex items-center text-sm font-bold text-[#133863] bg-[#f4f6f9] border border-slate-100 p-3 rounded mt-auto transition-colors">
                                                    <span>Почати тестування</span><ArrowRightIcon className="w-5 h-5 ml-auto group-hover:translate-x-1 transition-transform" />
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                    {quizData.length === 0 && (
                                        <div className="mt-8 p-6 bg-white rounded-md border border-slate-200 text-center text-slate-600 font-medium">
                                            Модулі тестування не знайдено. Перевірте підключення файлу <code className="text-[#133863] font-bold">data/manifest.js</code>.
                                        </div>
                                    )}
                                </div>
                            </div>
                        )
                    )}

                    {activeScreen === 'preQuiz' && (
                        <div className="min-h-screen flex items-center justify-center p-4 sm:p-6">
                            <div className="bg-white p-6 sm:p-8 rounded-md shadow-lg border-t-4 border-[#133863] w-full max-w-md text-center">
                                <UsersIcon className="w-12 h-12 text-[#133863] mx-auto mb-4" />
                                <h2 className="text-xl sm:text-2xl font-black text-[#133863] uppercase tracking-wide mb-2">Підготовка до іспиту</h2>
                                {pendingQuizTitle && <p className="text-xs font-bold text-[#133863] bg-[#eef3f8] px-3 py-1.5 rounded mb-3 inline-block">{pendingQuizTitle}</p>}
                                <p className="text-slate-500 mb-6 text-sm font-medium">Час на проходження: 20 хвилин.<br/>Результати фіксуються автоматично.</p>

                                {isPendingModuleLoading && (
                                    <div className="flex items-center justify-center gap-2 text-xs font-bold text-[#133863] bg-[#eef3f8] px-3 py-2.5 rounded mb-4">
                                        <SpinnerIcon className="w-4 h-4 shrink-0" />
                                        <span>{pendingQuizId === 'combined' ? 'Завантаження активних модулів...' : 'Завантаження запитань модуля...'}</span>
                                    </div>
                                )}

                                {!isPendingModuleLoading && pendingModuleError && (
                                    <div className="text-xs font-bold text-red-700 bg-red-50 border border-red-200 px-3 py-2.5 rounded mb-4 flex items-center justify-between gap-2 text-left">
                                        <span>{pendingModuleError}</span>
                                        <button
                                            type="button"
                                            onClick={() => ensureModulesLoaded([pendingQuizId])}
                                            className="px-2.5 py-1 bg-[#133863] text-white rounded shrink-0 hover:bg-[#0A2240] transition-colors"
                                        >
                                            Повторити
                                        </button>
                                    </div>
                                )}

                                <div className="text-left mb-8">
                                    <label className="block text-xs font-bold text-[#133863] uppercase tracking-wider mb-2">Вкажіть ваше ПІБ:</label>
                                    <input
                                        type="text"
                                        value={userName}
                                        onChange={(e) => setUserName(e.target.value)}
                                        onKeyDown={(e) => e.key === 'Enter' && confirmStartQuiz()}
                                        placeholder="Іванов Іван Іванович"
                                        className="w-full p-3 border border-slate-300 rounded focus:border-[#133863] outline-none transition-colors font-semibold"
                                        autoFocus
                                    />
                                </div>
                                <div className="flex gap-3">
                                    <button
                                        type="button"
                                        onClick={() => {
                                            preQuizRequestRef.current += 1;
                                            setIsPreparingQuiz(false);
                                            setActiveScreen('menu');
                                        }}
                                        className="flex-1 py-3 bg-slate-100 text-slate-600 font-bold rounded hover:bg-slate-200 transition-colors"
                                    >
                                        Скасувати
                                    </button>
                                    <button
                                        type="button"
                                        onClick={confirmStartQuiz}
                                        disabled={isPendingModuleLoading}
                                        className="flex-1 py-3 bg-[#133863] text-white font-bold rounded hover:bg-[#0A2240] disabled:opacity-60 disabled:cursor-not-allowed transition-colors flex items-center justify-center gap-2"
                                    >
                                        {isPendingModuleLoading ? (
                                            <>
                                                <SpinnerIcon className="w-4 h-4" />
                                                <span>Завантаження...</span>
                                            </>
                                        ) : (
                                            'Почати'
                                        )}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {activeScreen === 'quiz' && sessionQuestions[currentQuestionIndex] && (
                        <div className="min-h-screen flex flex-col items-center p-4 sm:p-6 exam-mode-active">
                            <div className="w-full max-w-3xl mb-4 sm:mb-6 flex flex-wrap items-center justify-between gap-3 bg-white p-3 sm:p-4 rounded-md shadow-sm border border-slate-200">
                                <div className="text-xs sm:text-sm font-bold text-slate-500 tracking-wide uppercase">
                                    Питання <span className="text-[#133863] text-lg sm:text-xl mx-1">{currentQuestionIndex + 1}</span> з {sessionQuestions.length}
                                </div>
                                <QuizTimer initialSeconds={EXAM_DURATION_SECONDS} onTimeUp={handleTimeUp} />
                            </div>

                            <div className="w-full max-w-3xl bg-white rounded-md shadow-sm border border-slate-200 overflow-hidden">
                                <div className="w-full bg-slate-100 h-1.5"><div className="bg-[#F7D622] h-1.5 transition-all duration-300" style={{ width: `${((currentQuestionIndex + 1) / sessionQuestions.length) * 100}%` }}></div></div>
                                <div className="p-5 sm:p-8 md:p-10">
                                    <h2 className="text-lg sm:text-xl md:text-2xl font-bold text-[#133863] mb-6 sm:mb-8 leading-relaxed">{sessionQuestions[currentQuestionIndex].question}</h2>
                                    <div className="space-y-3">
                                        {sessionQuestions[currentQuestionIndex].options.map((option, index) => {
                                            const isSelected = userAnswers[currentQuestionIndex] === index;
                                            return (
                                                <button type="button" key={index} onClick={() => handleOptionSelect(index)} className={`w-full text-left p-3.5 sm:p-4 rounded border transition-all flex items-start gap-3 sm:gap-4 ${isSelected ? 'border-[#133863] bg-[#eef3f8]' : 'border-slate-200 bg-white hover:border-[#133863]'}`}>
                                                    <div className="mt-0.5 shrink-0"><div className={`w-5 h-5 rounded-full border-2 flex items-center justify-center transition-colors ${isSelected ? 'border-[#133863]' : 'border-slate-300'}`}>{isSelected && <div className="w-2.5 h-2.5 bg-[#133863] rounded-full"></div>}</div></div>
                                                    <span className={`font-semibold text-sm sm:text-base md:text-lg ${isSelected ? 'text-[#133863]' : 'text-slate-700'}`}>{option.text}</span>
                                                </button>
                                            );
                                        })}
                                    </div>
                                    <div className="mt-8 sm:mt-10 flex flex-col-reverse sm:flex-row justify-between items-stretch sm:items-center gap-3 border-t pt-6">
                                        {currentQuestionIndex > 0 ? (
                                            <button type="button" onClick={handlePrevQuestion} className="flex items-center justify-center px-6 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded transition-colors uppercase tracking-wide text-sm">
                                                <ArrowLeftIcon className="w-4 h-4 mr-2" /> Назад
                                            </button>
                                        ) : <div className="hidden sm:block" />}
                                        <button type="button" onClick={handleNextQuestion} disabled={userAnswers[currentQuestionIndex] === null} className="flex items-center justify-center px-8 py-3 bg-[#133863] hover:bg-[#0A2240] text-white font-bold rounded shadow-sm transition-all disabled:opacity-50 disabled:cursor-not-allowed uppercase tracking-wide text-sm">
                                            {currentQuestionIndex < sessionQuestions.length - 1 ? 'Наступне питання' : 'Завершити іспит'} <ArrowRightIcon className="w-4 h-4 ml-3" />
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {activeScreen === 'result' && (
                        <div className="min-h-screen bg-white pb-12">
                            <div className="max-w-4xl mx-auto flex flex-wrap items-center justify-between gap-3 p-4 sm:p-6 bg-slate-50 border-b no-print mb-6 sm:mb-8">
                                <button type="button" onClick={goHome} className="flex items-center py-2 px-4 bg-white border border-slate-300 text-slate-700 font-bold rounded hover:bg-slate-100 transition-colors text-sm shadow-sm"><HomeIcon className="w-4 h-4 mr-2" /> На головну</button>
                                <div className="flex gap-3">
                                    <button type="button" onClick={handleExportWord} className="flex items-center py-2 px-4 bg-blue-600 text-white font-bold rounded hover:bg-blue-700 transition-colors text-sm shadow-sm"><FileTextIcon className="w-4 h-4 mr-2" /> Завантажити у Word (.doc)</button>
                                </div>
                            </div>

                            <div className="max-w-4xl mx-auto px-4 sm:px-6 print:px-0">
                                <div className="text-center mb-6 sm:mb-8 border-b-[3px] border-[#133863] pb-6 sm:pb-8">
                                    <ShieldIcon className="w-12 h-12 sm:w-16 sm:h-16 mx-auto text-[#133863] mb-4" />
                                    <h1 className="text-2xl sm:text-3xl font-black text-[#133863] uppercase tracking-widest mb-2">Досьє результатів тестування</h1>
                                    <h2 className="text-base sm:text-lg font-bold text-slate-600">{currentQuizMeta?.title}</h2>
                                </div>
                                
                                <div className="flex flex-col md:flex-row justify-between items-center bg-[#f4f6f9] border border-slate-200 p-5 sm:p-8 rounded-md mb-8 gap-6">
                                    <div className="text-center md:text-left">
                                        <p className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Юрист:</p>
                                        <p className="text-xl sm:text-2xl font-black text-[#133863] uppercase break-words">{userName}</p>
                                        <p className="text-sm font-semibold text-slate-500 mt-2">Дата: {currentDate}</p>
                                        {syncStatus !== 'idle' && (
                                            <span className={`inline-block mt-2 text-xs font-bold px-2.5 py-1 rounded ${syncStatus === 'sent' ? 'bg-emerald-100 text-emerald-800' : syncStatus === 'offline' ? 'bg-amber-100 text-amber-800' : 'bg-blue-100 text-[#133863]'}`}>
                                                {syncStatus === 'sent' ? 'Результати надіслано в таблицю' : syncStatus === 'offline' ? 'Офлайн-режим: збережено локально' : 'Надсилання результатів...'}
                                            </span>
                                        )}
                                    </div>
                                    
                                    <div className="flex items-center justify-center gap-6 sm:gap-8 bg-white p-4 rounded border border-slate-200 w-full md:w-auto">
                                        <div className="text-center">
                                            <p className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Ваш бал</p>
                                            <p className="text-3xl sm:text-4xl font-black text-[#133863]">{score}<span className="text-lg sm:text-xl text-slate-300">/{sessionQuestions.length}</span></p>
                                        </div>
                                        <div className="w-px h-12 bg-slate-200"></div>
                                        <div className="text-center">
                                            <p className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Успішність</p>
                                            <p className={`text-3xl sm:text-4xl font-black ${resultPercentage >= 80 ? 'text-emerald-600' : 'text-red-500'}`}>{resultPercentage}%</p>
                                        </div>
                                    </div>
                                </div>

                                <h3 className="text-lg sm:text-xl font-bold text-[#133863] mb-6 uppercase tracking-wide border-l-4 border-[#F7D622] pl-3">Детальний розбір відповідей:</h3>
                                <div className="space-y-4">
                                    {sessionQuestions.map((q, idx) => {
                                        const uAnsIdx = userAnswers[idx];
                                        const isCorrect = uAnsIdx === q.correctIndex;
                                        const skipped = uAnsIdx === null || uAnsIdx === undefined;
                                        const correctOption = q.options[q.correctIndex] || {};

                                        return (
                                            <div key={idx} className="p-4 sm:p-6 border-l-4 bg-white border-t border-r border-b border-slate-100 print-border print-break-inside-avoid" style={{ borderLeftColor: isCorrect ? '#10b981' : '#ef4444' }}>
                                                <p className="font-bold text-base text-slate-800 mb-4 leading-relaxed">
                                                    <span className="text-slate-400 mr-2">#{idx + 1}.</span> {q.question}
                                                </p>
                                                
                                                <div className="mb-3">
                                                    <span className="font-bold block text-xs uppercase mb-1 text-slate-500">Ваша відповідь:</span>
                                                    <p className={`font-semibold text-sm p-3 rounded ${isCorrect ? 'bg-emerald-50 text-emerald-800 border border-emerald-100' : 'bg-red-50 text-red-800 border border-red-100'}`}>
                                                        {skipped ? "Не надано відповіді (час вичерпано)" : q.options[uAnsIdx]?.text}
                                                        <span className="ml-2 font-black">{isCorrect ? '(✓ Вірно)' : '(✗ Помилка)'}</span>
                                                    </p>
                                                </div>

                                                {!isCorrect && (
                                                    <div className="mb-3">
                                                        <span className="font-bold block text-xs uppercase mb-1 text-emerald-600">Правильна відповідь:</span>
                                                        <p className="font-semibold text-sm p-3 rounded bg-emerald-50 text-emerald-800 border border-emerald-100">
                                                            {correctOption.text}
                                                        </p>
                                                    </div>
                                                )}

                                                <div className="mt-4 pt-3 border-t border-slate-100">
                                                    <span className="font-bold block text-xs uppercase mb-1 text-[#133863]">Обґрунтування (Норма):</span>
                                                    <p className="text-slate-600 text-sm leading-relaxed font-medium">
                                                        {correctOption.rationale}
                                                    </p>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const container = document.getElementById('app');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>

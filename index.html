        const UsersIcon = ({ className }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>;
        const FileTextIcon = ({ className }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>;
        const MonitorIcon = ({ className }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>;
        const LayersIcon = ({ className }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>;
        const ArrowRightIcon = ({ className }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>;
        const ArrowLeftIcon = ({ className }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>;
        const SearchIcon = ({ className }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>;
        const ClockIcon = ({ className }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>;
        const HomeIcon = ({ className }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>;
        const Trash2Icon = ({ className }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>;
        const PlusIcon = ({ className }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
        const XIcon = ({ className }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
        const UploadIcon = ({ className }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>;
        const DownloadIcon = ({ className }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>;

        const EXAM_DURATION_SECONDS = 1200;
        const MAX_EXAM_QUESTIONS = 20;
        const ADMIN_PAGE_SIZE = 20;

        const shuffleArray = (array) => {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        };

        const formatTime = (seconds) => {
            const safeSeconds = Math.max(0, seconds);
            const m = Math.floor(safeSeconds / 60).toString().padStart(2, '0');
            const s = (safeSeconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        };

        const escapeHtml = (value) => {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        };

        const normalizeQuestion = (rawQ) => {
            if (!rawQ || typeof rawQ !== 'object') return null;
            const questionText = typeof rawQ.question === 'string' ? rawQ.question.trim() : '';
            if (!questionText) return null;

            const rawOptions = Array.isArray(rawQ.options)
                ? rawQ.options
                : (Array.isArray(rawQ.answerOptions) ? rawQ.answerOptions : null);
            if (!rawOptions || rawOptions.length < 2) return null;

            const mappedOptions = rawOptions
                .filter(opt => opt && typeof opt === 'object' && typeof opt.text === 'string')
                .map(opt => ({
                    text: opt.text,
                    isCorrect: Boolean(opt.isCorrect),
                    rationale: typeof opt.rationale === 'string' ? opt.rationale : ''
                }));

            if (mappedOptions.length < 2) return null;

            const firstCorrectIdx = mappedOptions.findIndex(o => o.isCorrect);
            const normalizedCorrectIdx = firstCorrectIdx >= 0 ? firstCorrectIdx : 0;

            return {
                question: rawQ.question,
                options: mappedOptions.map((o, idx) => ({
                    ...o,
                    isCorrect: idx === normalizedCorrectIdx
                }))
            };
        };

        const normalizeModule = (rawMod, idx) => {
            if (!rawMod || typeof rawMod !== 'object') return null;
            if (typeof rawMod.id !== 'string' || !rawMod.id.trim()) return null;
            if (typeof rawMod.title !== 'string') return null;
            if (!Array.isArray(rawMod.questions)) return null;

            const normalizedQuestions = rawMod.questions.map(normalizeQuestion).filter(Boolean);
            if (rawMod.questions.length > 0 && normalizedQuestions.length === 0) return null;

            return {
                id: rawMod.id.trim(),
                title: rawMod.title.trim() || `Модуль ${idx + 1}`,
                icon: typeof rawMod.icon === 'string' && rawMod.icon.trim() ? rawMod.icon : 'layers',
                color: typeof rawMod.color === 'string' && rawMod.color.trim() ? rawMod.color : 'text-[#133863]',
                bgColor: typeof rawMod.bgColor === 'string' && rawMod.bgColor.trim() ? rawMod.bgColor : 'bg-[#eef3f8]',
                isHidden: Boolean(rawMod.isHidden),
                questions: normalizedQuestions
            };
        };

        const getIconComponent = (iconName, className) => {
            switch(iconName) {
                case 'book': return <BookOpenIcon className={className} />;
                case 'users': return <UsersIcon className={className} />;
                case 'file-text': return <FileTextIcon className={className} />;
                case 'shield': return <ShieldIcon className={className} />;
                case 'monitor': return <MonitorIcon className={className} />;
                case 'layers': return <LayersIcon className={className} />;
                default: return <BookOpenIcon className={className} />;
            }
        };

        // Ізольований компонент таймера: запобігає щосекундному ререндеру всього <App />
        const QuizTimer = memo(({ initialSeconds, onTimeUp }) => {
            const [timeLeft, setTimeLeft] = useState(initialSeconds);
            const onTimeUpRef = useRef(onTimeUp);
            const hasFiredRef = useRef(false);

            useEffect(() => {
                onTimeUpRef.current = onTimeUp;
            }, [onTimeUp]);

            useEffect(() => {
                setTimeLeft(initialSeconds);
                hasFiredRef.current = false;
                const endTime = Date.now() + initialSeconds * 1000;

                const timer = setInterval(() => {
                    const remaining = Math.max(0, Math.round((endTime - Date.now()) / 1000));
                    setTimeLeft(remaining);
                    if (remaining <= 0) {
                        clearInterval(timer);
                        if (!hasFiredRef.current) {
                            hasFiredRef.current = true;
                            onTimeUpRef.current();
                        }
                    }
                }, 1000);

                return () => clearInterval(timer);
            }, [initialSeconds]);

            return (
                <div className={`flex items-center gap-2 px-3 sm:px-4 py-2 rounded font-bold text-base sm:text-lg transition-colors border shrink-0 ${timeLeft <= 180 ? 'bg-red-50 border-red-200 text-red-600 animate-pulse' : 'bg-[#f4f6f9] border-slate-200 text-[#133863]'}`}>
                    <ClockIcon className="w-5 h-5" />
                    <span>{formatTime(timeLeft)}</span>
                </div>
            );
        });

        // Мемоізована картка питання в Адмін-панелі для швидкого рендеру на великих базах (250+ питань)
        const AdminQuestionCard = memo(({ q, qIdx, modIdx, onUpdate, onDeleteRequest }) => {
            return (
                <div className="bg-white p-4 sm:p-5 rounded-md border border-gray-200 shadow-sm relative group">
                    <button
                        type="button"
                        onClick={() => onDeleteRequest(modIdx, qIdx)}
                        aria-label={`Видалити запитання ${qIdx + 1}`}
                        title="Видалити запитання"
                        className="absolute top-3 right-3 sm:top-4 sm:right-4 p-1.5 text-gray-400 hover:text-red-500 opacity-100 sm:opacity-0 sm:group-hover:opacity-100 focus:opacity-100 transition-all"
                    >
                        <Trash2Icon className="w-5 h-5" />
                    </button>
                    <div className="mb-4 pr-10">
                        <label className="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Запитання {qIdx + 1}</label>
                        <textarea
                            className="w-full p-3 border border-gray-300 rounded font-semibold text-gray-800 text-sm sm:text-base focus:border-[#133863] outline-none resize-none transition-colors"
                            rows="2"
                            value={q.question}
                            onChange={(e) => onUpdate(modIdx, qIdx, 'question', e.target.value)}
                        />
                    </div>
                    <div className="grid grid-cols-1 gap-3">
                        {q.options.map((opt, oIdx) => (
                            <div key={oIdx} className={`p-3 rounded border ${opt.isCorrect ? 'border-emerald-300 bg-emerald-50' : 'border-gray-200 bg-gray-50'} flex gap-3 items-start`}>
                                <input
                                    type="radio"
                                    name={`correct-${modIdx}-${qIdx}`}
                                    checked={opt.isCorrect}
                                    onChange={() => onUpdate(modIdx, qIdx, 'isCorrect', true, oIdx)}
                                    className="mt-1.5 w-4 h-4 accent-[#133863] shrink-0"
                                />
                                <div className="flex-1 space-y-2 min-w-0">
                                    <input
                                        className="w-full p-2 border border-gray-300 rounded bg-white text-sm focus:border-[#133863] outline-none transition-colors font-medium"
                                        value={opt.text}
                                        placeholder="Текст відповіді"
                                        onChange={(e) => onUpdate(modIdx, qIdx, 'text', e.target.value, oIdx)}
                                    />
                                    {opt.isCorrect && (
                                        <textarea
                                            className="w-full p-2 border border-emerald-300 rounded bg-white text-xs focus:border-emerald-500 outline-none resize-none transition-colors font-medium"
                                            value={opt.rationale}
                                            placeholder="Норма закону та юридичне обґрунтування"
                                            rows="2"
                                            onChange={(e) => onUpdate(modIdx, qIdx, 'rationale', e.target.value, oIdx)}
                                        />
                                    )}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        });

        const App = () => {
            const [quizData, setQuizData] = useState(defaultQuizData);
            const [isAdmin, setIsAdmin] = useState(false);
            const [showLogin, setShowLogin] = useState(false);
            const [password, setPassword] = useState('');
            const [adminActiveTab, setAdminActiveTab] = useState(0);
            const [adminSearchQuery, setAdminSearchQuery] = useState('');
            const [visibleQuestionsCount, setVisibleQuestionsCount] = useState(ADMIN_PAGE_SIZE);

            const [activeScreen, setActiveScreen] = useState('menu'); 
            const [currentQuizMeta, setCurrentQuizMeta] = useState(null);
            const [sessionQuestions, setSessionQuestions] = useState([]);
            const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
            const [userAnswers, setUserAnswers] = useState([]); 
            const [score, setScore] = useState(0);
            
            const [userName, setUserName] = useState('');
            const [pendingQuizId, setPendingQuizId] = useState(null);
            const [currentDate, setCurrentDate] = useState('');
            const [syncStatus, setSyncStatus] = useState('idle');

            // Сповіщення
            const [toast, setToast] = useState(null);
            const [deleteConfirm, setDeleteConfirm] = useState(null);

            const toastTimerRef = useRef(null);
            const isFinishingRef = useRef(false);

            const showToast = useCallback((message, type = 'info') => {
                if (toastTimerRef.current) {
                    clearTimeout(toastTimerRef.current);
                }
                setToast({ message, type });
                toastTimerRef.current = setTimeout(() => {
                    setToast(null);
                    toastTimerRef.current = null;
                }, 4000);
            }, []);

            useEffect(() => {
                return () => {
                    if (toastTimerRef.current) {
                        clearTimeout(toastTimerRef.current);
                    }
                };
            }, []);

            // Античит: блокування контекстного меню, копіювання/вставки та гарячих клавіш (включно з кириличною розкладкою)
            useEffect(() => {
                if (activeScreen !== 'quiz') return;

                const handleContextMenu = (e) => e.preventDefault();
                const handleClipboard = (e) => e.preventDefault();
                const handleKeyDown = (e) => {
                    if (e.ctrlKey || e.metaKey) {
                        const key = (e.key || '').toLowerCase();
                        const code = e.code || '';
                        if (
                            ['c', 'v', 'a', 'p', 's'].includes(key) ||
                            ['KeyC', 'KeyV', 'KeyA', 'KeyP', 'KeyS'].includes(code)
                        ) {
                            e.preventDefault();
                        }
                    }
                };

                document.addEventListener('contextmenu', handleContextMenu);
                document.addEventListener('keydown', handleKeyDown);
                document.addEventListener('copy', handleClipboard);
                document.addEventListener('cut', handleClipboard);
                document.addEventListener('paste', handleClipboard);

                return () => {
                    document.removeEventListener('contextmenu', handleContextMenu);
                    document.removeEventListener('keydown', handleKeyDown);
                    document.removeEventListener('copy', handleClipboard);
                    document.removeEventListener('cut', handleClipboard);
                    document.removeEventListener('paste', handleClipboard);
                };
            }, [activeScreen]);

            const initiateQuiz = (quizId) => {
                setPendingQuizId(quizId);
                setActiveScreen('preQuiz');
            };

            const pendingQuizTitle = useMemo(() => {
                if (!pendingQuizId) return '';
                if (pendingQuizId === 'combined') return "Об'єднаний іспит (Всі активні теми)";
                return quizData.find(q => q.id === pendingQuizId)?.title || '';
            }, [pendingQuizId, quizData]);

            const confirmStartQuiz = () => {
                const trimmedName = userName.trim();
                if (!trimmedName) {
                    showToast("Будь ласка, введіть ваше ПІБ для початку іспиту.", "error");
                    return;
                }

                let pool = [];
                let title = "";
                
                if (pendingQuizId === 'combined') {
                    quizData.filter(q => !q.isHidden).forEach(q => pool.push(...q.questions));
                    title = "Об'єднаний іспит (Всі теми)";
                } else {
                    const quiz = quizData.find(q => q.id === pendingQuizId);
                    if (!quiz) {
                        showToast("Обраний модуль не знайдено.", "error");
                        setActiveScreen('menu');
                        return;
                    }
                    pool = [...quiz.questions];
                    title = quiz.title;
                }

                if (pool.length === 0) {
                    showToast("У цьому модулі ще немає питань! Завантажте їх через адмін-панель.", "error");
                    return;
                }

                const shuffledPool = shuffleArray(pool);
                const maxQuestions = Math.min(MAX_EXAM_QUESTIONS, shuffledPool.length);
                const selectedQuestions = shuffledPool.slice(0, maxQuestions);

                const questionsWithShuffledOptions = selectedQuestions.map(q => {
                    const shuffledOptions = shuffleArray(q.options);
                    const foundIdx = shuffledOptions.findIndex(o => o.isCorrect);
                    return { ...q, options: shuffledOptions, correctIndex: foundIdx >= 0 ? foundIdx : 0 };
                });

                isFinishingRef.current = false;
                setSyncStatus('idle');
                setUserName(trimmedName);
                setCurrentQuizMeta({ id: pendingQuizId, title: title });
                setSessionQuestions(questionsWithShuffledOptions);
                setUserAnswers(new Array(selectedQuestions.length).fill(null));
                setCurrentQuestionIndex(0);
                setActiveScreen('quiz');
                
                const today = new Date();
                setCurrentDate(today.toLocaleDateString('uk-UA', { day: '2-digit', month: 'long', year: 'numeric' }) + ' ' + today.toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' }));
            };

            const handleOptionSelect = (index) => {
                setUserAnswers(prev => {
                    const next = [...prev];
                    next[currentQuestionIndex] = index;
                    return next;
                });
            };

            const sendToGoogleSheets = async (finalScore, totalQuestions, percentage, errorsData, isTimeOut = false) => {
                if (!GOOGLE_SHEETS_WEBHOOK_URL || GOOGLE_SHEETS_WEBHOOK_URL.includes("ВАШ_WEBHOOK_URL_ТУТ")) return;

                if (typeof navigator !== 'undefined' && navigator.onLine === false) {
                    setSyncStatus('offline');
                    if (!isTimeOut) {
                        showToast("Офлайн-режим: Результати збережено локально на екрані.", "info");
                    }
                    return;
                }

                setSyncStatus('sending');
                const payload = {
                    date: new Date().toLocaleString('uk-UA'),
                    name: userName.trim(),
                    module: currentQuizMeta?.title || '',
                    score: `${finalScore}/${totalQuestions}`,
                    percentage: `${percentage}%`,
                    errors: JSON.stringify(errorsData)
                };

                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 4000);

                try {
                    await fetch(GOOGLE_SHEETS_WEBHOOK_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload),
                        signal: controller.signal
                    });
                    setSyncStatus('sent');
                    if (!isTimeOut) {
                        showToast("Результати успішно надіслані в систему!", "success");
                    }
                } catch (e) {
                    console.warn("Помилка зв'язку з сервером", e);
                    setSyncStatus('offline');
                    if (!isTimeOut) {
                        showToast("Офлайн-режим: Результати збережено локально на екрані.", "info");
                    }
                } finally {
                    clearTimeout(timeoutId);
                }
            };

            const handleFinishTest = useCallback((isTimeOut = false) => {
                if (isFinishingRef.current || sessionQuestions.length === 0) return;
                isFinishingRef.current = true;

                let finalScore = 0;
                const errorsData = [];

                userAnswers.forEach((ans, idx) => {
                    if (ans === sessionQuestions[idx].correctIndex) {
                        finalScore++;
                    } else {
                        errorsData.push(idx + 1); 
                    }
                });

                setScore(finalScore);
                const percentage = Math.round((finalScore / sessionQuestions.length) * 100);

                if (isTimeOut) {
                    showToast("Час вичерпано! Тестування завершено автоматично.", "error");
                }

                sendToGoogleSheets(finalScore, sessionQuestions.length, percentage, errorsData, isTimeOut);
                setActiveScreen('result');
            }, [sessionQuestions, userAnswers, userName, currentQuizMeta, showToast]);

            const handleTimeUp = useCallback(() => {
                handleFinishTest(true);
            }, [handleFinishTest]);

            const handlePrevQuestion = () => {
                if (currentQuestionIndex > 0) {
                    setCurrentQuestionIndex(prev => prev - 1);
                }
            };

            const handleNextQuestion = () => {
                if (currentQuestionIndex < sessionQuestions.length - 1) {
                    setCurrentQuestionIndex(prev => prev + 1);
                } else {
                    handleFinishTest(false);
                }
            };

            const goHome = () => {
                isFinishingRef.current = false;
                setActiveScreen('menu');
                setCurrentQuizMeta(null);
                setSessionQuestions([]);
                setUserAnswers([]);
                setSyncStatus('idle');
            };

            const handleLogin = () => {
                if (password === 'admin') {
                    setIsAdmin(true);
                    setShowLogin(false);
                } else {
                    showToast("Невірний пароль", "error");
                }
                setPassword('');
            };

            const selectAdminTab = (idx) => {
                setAdminActiveTab(idx);
                setAdminSearchQuery('');
                setVisibleQuestionsCount(ADMIN_PAGE_SIZE);
            };

            const updateModuleTitle = (modIdx, newTitle) => {
                setQuizData(prevData => {
                    const newData = [...prevData];
                    newData[modIdx] = { ...newData[modIdx], title: newTitle };
                    return newData;
                });
            };

            const toggleModuleVisibility = (modIdx) => {
                setQuizData(prevData => {
                    const newData = [...prevData];
                    const nextHidden = !newData[modIdx].isHidden;
                    newData[modIdx] = { ...newData[modIdx], isHidden: nextHidden };
                    showToast(nextHidden ? "Модуль тепер приховано від юристів" : "Модуль тепер видимий на головній", "info");
                    return newData;
                });
            };

            const handleCreateModule = () => {
                const newModId = 'custom_mod_' + Date.now();
                const newModule = {
                    id: newModId,
                    title: 'Новий модуль (Редагується)',
                    icon: 'layers',
                    color: 'text-[#133863]',
                    bgColor: 'bg-[#eef3f8]',
                    isHidden: true,
                    questions: []
                };
                setQuizData(prevData => {
                    const nextData = [...prevData, newModule];
                    setAdminActiveTab(nextData.length - 1);
                    return nextData;
                });
                setAdminSearchQuery('');
                setVisibleQuestionsCount(ADMIN_PAGE_SIZE);
                showToast("Створено порожній модуль! Вкажіть його назву та додайте запитання.", "success");
            };

            const updateQuestion = useCallback((modIdx, qIdx, field, value, optIdx = null) => {
                setQuizData(prevData => {
                    if (!prevData[modIdx] || !prevData[modIdx].questions[qIdx]) return prevData;
                    const newData = [...prevData];
                    const targetMod = { ...newData[modIdx] };
                    const newQuestions = [...targetMod.questions];
                    const targetQ = { ...newQuestions[qIdx] };

                    if (optIdx !== null) {
                        const newOptions = [...targetQ.options];
                        if (field === 'isCorrect') {
                            targetQ.options = newOptions.map((o, idx) => ({
                                ...o,
                                isCorrect: idx === optIdx
                            }));
                        } else {
                            newOptions[optIdx] = {
                                ...newOptions[optIdx],
                                [field]: value
                            };
                            targetQ.options = newOptions;
                        }
                    } else {
                        targetQ[field] = value;
                    }

                    newQuestions[qIdx] = targetQ;
                    targetMod.questions = newQuestions;
                    newData[modIdx] = targetMod;
                    return newData;
                });
            }, []);

            const handleDeleteRequest = useCallback((modIdx, qIdx) => {
                setDeleteConfirm({ modIdx, qIdx });
            }, []);

            const addNewQuestion = (modIdx) => {
                setQuizData(prevData => {
                    if (!prevData[modIdx]) return prevData;
                    const newData = [...prevData];
                    newData[modIdx] = {
                        ...newData[modIdx],
                        questions: [
                            {
                                question: "Текст нового запитання?",
                                options: [
                                    { text: "Варіант відповіді 1 (Правильний)", isCorrect: true, rationale: "Юридичне обґрунтування норми закону" },
                                    { text: "Варіант відповіді 2", isCorrect: false, rationale: "Пояснення" },
                                    { text: "Варіант відповіді 3", isCorrect: false, rationale: "Пояснення" },
                                    { text: "Варіант відповіді 4", isCorrect: false, rationale: "Пояснення" }
                                ]
                            },
                            ...newData[modIdx].questions
                        ]
                    };
                    return newData;
                });
                setAdminSearchQuery('');
                showToast("Питання успішно додано!", "success");
            };

            const executeDelete = () => {
                if (!deleteConfirm) return;
                const { modIdx, qIdx } = deleteConfirm;
                setQuizData(prevData => {
                    if (!prevData[modIdx]) return prevData;
                    const newData = [...prevData];
                    const nextQuestions = [...newData[modIdx].questions];
                    nextQuestions.splice(qIdx, 1);
                    newData[modIdx] = { ...newData[modIdx], questions: nextQuestions };
                    return newData;
                });
                showToast("Питання видалено", "info");
                setDeleteConfirm(null);
            };

            const handleImportJSON = (e) => {
                const inputEl = e.target;
                const file = inputEl.files && inputEl.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const importedData = JSON.parse(event.target.result);

                        if (Array.isArray(importedData) && importedData.length > 0 && importedData[0] && typeof importedData[0] === 'object' && 'id' in importedData[0] && 'questions' in importedData[0]) {
                            const normalizedModules = importedData.map((mod, idx) => normalizeModule(mod, idx)).filter(Boolean);
                            if (normalizedModules.length === 0 || normalizedModules.length !== importedData.length) {
                                showToast("Помилка структури модулів у JSON. Перевірте поля id, title та questions.", "error");
                                return;
                            }
                            setQuizData(normalizedModules);
                            setAdminActiveTab(0);
                            setAdminSearchQuery('');
                            setVisibleQuestionsCount(ADMIN_PAGE_SIZE);
                            showToast("Усю структуру тестів успішно оновлено!", "success");
                            return;
                        }

                        const rawQuestions = Array.isArray(importedData)
                            ? importedData
                            : (importedData && Array.isArray(importedData.questions) ? importedData.questions : null);

                        if (!rawQuestions || rawQuestions.length === 0) {
                            showToast("Файл порожній або має неправильний формат JSON.", "error");
                            return;
                        }

                        const formattedQuestions = rawQuestions.map(normalizeQuestion).filter(Boolean);
                        if (formattedQuestions.length === 0) {
                            showToast("У файлі не знайдено жодного коректного питання (потрібні question та мінімум 2 options).", "error");
                            return;
                        }

                        const targetTabIdx = quizData[adminActiveTab] ? adminActiveTab : 0;
                        if (!quizData[targetTabIdx]) {
                            showToast("Спочатку створіть хоча б один модуль.", "error");
                            return;
                        }

                        setQuizData(prevData => {
                            const newData = [...prevData];
                            newData[targetTabIdx] = {
                                ...newData[targetTabIdx],
                                questions: [...newData[targetTabIdx].questions, ...formattedQuestions]
                            };
                            return newData;
                        });

                        const skippedCount = rawQuestions.length - formattedQuestions.length;
                        if (skippedCount > 0) {
                            showToast(`Додано ${formattedQuestions.length} питань (${skippedCount} некоректних пропущено).`, "info");
                        } else {
                            showToast(`Успішно додано ${formattedQuestions.length} питань!`, "success");
                        }
                    } catch (error) {
                        showToast("Помилка читання файлу. Перевірте валідність JSON.", "error");
                        console.error(error);
                    } finally {
                        inputEl.value = '';
                    }
                };
                reader.onerror = () => {
                    showToast("Не вдалося прочитати вибраний файл.", "error");
                    inputEl.value = '';
                };
                reader.readAsText(file);
            };

            const handleExportJSON = () => {
                try {
                    const blob = new Blob([JSON.stringify(quizData, null, 2)], { type: 'application/json;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const downloadAnchor = document.createElement('a');
                    downloadAnchor.setAttribute("href", url);
                    downloadAnchor.setAttribute("download", `bpd_quiz_database_${new Date().toISOString().slice(0, 10)}.json`);
                    document.body.appendChild(downloadAnchor);
                    downloadAnchor.click();
                    downloadAnchor.remove();
                    setTimeout(() => URL.revokeObjectURL(url), 1000);
                    showToast("Базу тестів успішно експортовано!", "success");
                } catch (error) {
                    showToast("Помилка під час експорту.", "error");
                }
            };

            const handleCompileHTML = () => {
                try {
                    const scriptElement = document.querySelector('script[type="text/babel"]');
                    if (!scriptElement) {
                        showToast("Компіляція доступна лише при збереженні файлу локально.", "info");
                        return;
                    }
                    const scriptContent = scriptElement.textContent || scriptElement.innerHTML;
                    const databaseRegex = /(\/\/ DATABASE_START)[\s\S]*?(\/\/ DATABASE_END)/;
                    if (!databaseRegex.test(scriptContent)) {
                        showToast("Помилка: не знайдено маркери бази даних у скрипті.", "error");
                        return;
                    }

                    // Екранування спецпослідовностей для безпечного вбудовування в HTML script-блок і повторної компіляції
                    const safeJson = JSON.stringify(quizData, null, 2)
                        .replace(/</g, '\\u003c')
                        .replace(/>/g, '\\u003e')
                        .replace(/\u2028/g, '\\u2028')
                        .replace(/\u2029/g, '\\u2029')
                        .replace(/\/\/(\s*DATABASE_(?:START|END))/g, '\\/\\/$1');

                    const updatedDatabaseString = '// DATABASE_START\n        const defaultQuizData = ' + safeJson + ';\n        // DATABASE_END';
                    const updatedScript = scriptContent
                        .replace(databaseRegex, () => updatedDatabaseString)

                    const styleElement = document.getElementById('app-styles');
                    const styleContent = styleElement ? styleElement.textContent : `
        body {

            -moz-user-select: none;
            -ms-user-select: none;
        }
        @media print { 
            .no-print { display: none !important; }

        }
    `;

                    const s = 'script';
                    const fullHTML = '<!DOCTYPE html>\n<html lang="uk">\n<head>\n' +

                        '    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n' +

                        '    <' + s + ' src="https://cdn.tailwindcss.com"></' + s + '>\n' +
                        '    <' + s + ' src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></' + s + '>\n' +
                        '    <' + s + ' src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></' + s + '>\n' +
                        '    <' + s + ' src="https://unpkg.com/@babel/standalone/babel.min.js"></' + s + '>\n' +
                        '    <link rel="preconnect" href="https://fonts.googleapis.com">\n' +
                        '    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n' +
                        '    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">\n' +
                        '    <style id="app-styles">' + styleContent + '</style>\n' +
                        '</head>\n<body class="antialiased">\n    <div id="app"></div>\n' +
                        '    <' + s + ' type="text/babel">\n' +
                        updatedScript + '\n' +
                        '    </' + s + '>\n</body>\n</html>';

                    const blob = new Blob([fullHTML], { type: 'text/html;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const downloadAnchor = document.createElement('a');
                    downloadAnchor.setAttribute("href", url);
                    downloadAnchor.setAttribute("download", "portal_bpd_compiled.html");
                    document.body.appendChild(downloadAnchor);
                    downloadAnchor.click();
                    downloadAnchor.remove();
                    setTimeout(() => URL.revokeObjectURL(url), 1000);
                    
                    showToast("Компільовано новий файл! Надішліть його колегам.", "success");
                } catch (error) {
                    showToast("Помилка під час компіляції файлу.", "error");
                    console.error(error);
                }
            };

            const handleExportWord = () => {

                            </div>
                        `;
                    });

                    const content = `
                    <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">

                            .header h1 { color: #133863; margin: 0 0 5px 0; font-size: 22pt; text-transform: uppercase; }
                            .header h2 { color: #475569; margin: 0; font-size: 14pt; font-weight: normal; }
                            .summary { background-color: #f0f5fa; border: 1px solid #cce0f5; padding: 20px; margin-bottom: 30px; }
                            .summary-table { width: 100%; border-collapse: collapse; }
                            .summary-table td { padding: 5px; font-size: 11pt; }
                        </style>
                    </head>
                    <body>
                        <div class="header">
                            <h1>Досьє результатів тестування</h1>
                            <h2>Тема: ${escapeHtml(currentQuizMeta?.title || '')}</h2>
                        </div>
                        
                        <div class="summary">
                            <table class="summary-table">
                                <tr>
                                    <td style="width: 15%;"><strong>Юрист:</strong></td>
                                    <td style="width: 50%; font-size: 12pt; font-weight: bold; color: #133863;">${escapeHtml(userName)}</td>
                                    <td style="width: 15%; text-align: right;"><strong>Ваш бал:</strong></td>
                                    <td style="width: 20%; font-size: 14pt; font-weight: bold; color: #133863; text-align: right;">${score} / ${sessionQuestions.length}</td>
                                </tr>
                                <tr>
                                    <td><strong>Дата:</strong></td>
                                    <td>${escapeHtml(currentDate)}</td>
                                    <td style="text-align: right;"><strong>Успішність:</strong></td>
                                    <td style="font-size: 14pt; font-weight: bold; color: ${isPassed ? '#059669' : '#dc2626'}; text-align: right;">${percentage}%</td>
                                </tr>
                            </table>
                        </div>
                        <h3 style="color: #133863; border-bottom: 1px solid #133863; padding-bottom: 5px; margin-bottom: 20px;">Детальний розбір відповідей для роботи над помилками:</h3>
                        ${questionsHtml}
                    </body>
                    </html>
                    `;

                    const safeFileName = userName.trim().replace(/[^a-zA-Zа-яА-ЯіІїЇєЄґҐ0-9_-]+/g, '_') || 'Юрист';
                    const blob = new Blob(['\ufeff' + content], { type: 'application/msword;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const downloadAnchor = document.createElement('a');
                    downloadAnchor.href = url;
                    downloadAnchor.download = `Звіт_тестування_${safeFileName}_${new Date().toISOString().slice(0, 10)}.doc`;
                    document.body.appendChild(downloadAnchor);
                    downloadAnchor.click();
                    downloadAnchor.remove();
                    setTimeout(() => URL.revokeObjectURL(url), 1000);
                    showToast("Звіт для роботи над помилками завантажено у форматі Word!", "success");
                } catch (error) {
                    showToast("Не вдалося сформувати файл Word.", "error");
                    console.error(error);
                }
            };

            const effectiveAdminTab = quizData[adminActiveTab] ? adminActiveTab : 0;
            const currentAdminModule = quizData[effectiveAdminTab] || null;
            const currentAdminQuestions = currentAdminModule ? currentAdminModule.questions : [];
            const currentAdminModuleId = currentAdminModule ? currentAdminModule.id : '';
            const currentAdminQuestionsCount = currentAdminQuestions.length;

            // Обчислюємо індекси лише при зміні запиту, вкладки або кількості питань,
            // щоб картка питання не зникала з екрану під час редагування тексту
            const matchedAdminIndices = useMemo(() => {
                const query = adminSearchQuery.trim().toLowerCase();
                if (!query) {
                    return currentAdminQuestions.map((_, idx) => idx);
                }
                const indices = [];
                currentAdminQuestions.forEach((q, idx) => {
                    const matchesQuestion = (q.question || '').toLowerCase().includes(query);
                    const matchesOption = (q.options || []).some(opt =>
                        (opt.text || '').toLowerCase().includes(query) ||
                        (opt.rationale || '').toLowerCase().includes(query)
                    );
                    if (matchesQuestion || matchesOption) {
                        indices.push(idx);
                    }
                });
                return indices;
            }, [adminSearchQuery, effectiveAdminTab, currentAdminModuleId, currentAdminQuestionsCount]);

            const filteredAdminQuestions = useMemo(() => {
                return matchedAdminIndices
                    .map(originalIdx => ({
                        q: currentAdminQuestions[originalIdx],
                        originalIdx
                    }))
                    .filter(item => Boolean(item.q));
            }, [matchedAdminIndices, currentAdminQuestions]);

            const visibleAdminQuestions = useMemo(() => {
                return filteredAdminQuestions.slice(0, visibleQuestionsCount);
            }, [filteredAdminQuestions, visibleQuestionsCount]);

            const resultPercentage = sessionQuestions.length > 0
                ? Math.round((score / sessionQuestions.length) * 100)
                : 0;

            return (
                <div className="min-h-screen">
                    
                    {toast && (
                        <div className={`fixed top-4 left-4 right-4 sm:left-auto sm:top-6 sm:right-6 sm:max-w-md p-4 rounded-md shadow-xl z-[100] text-white font-bold text-sm sm:text-base transition-all ${toast.type === 'error' ? 'bg-red-500' : toast.type === 'success' ? 'bg-emerald-500' : 'bg-[#133863]'}`}>
                            {toast.message}
                        </div>
                    )}

                    {deleteConfirm && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white p-6 rounded-md shadow-xl max-w-sm w-full border border-slate-200">
                                <h3 className="text-xl font-bold text-slate-800 mb-2">Видалити це питання?</h3>
                                <p className="text-slate-600 mb-6 font-medium">Цю дію неможливо скасувати.</p>
                                <div className="flex gap-3">
                                    <button type="button" onClick={() => setDeleteConfirm(null)} className="flex-1 py-3 bg-slate-100 text-slate-700 rounded-md font-bold hover:bg-slate-200 transition-colors">Скасувати</button>
                                    <button type="button" onClick={executeDelete} className="flex-1 py-3 bg-red-500 text-white rounded-md font-bold hover:bg-red-600 transition-colors">Видалити</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showLogin && (
                        <div className="fixed inset-0 bg-[#133863]/90 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white p-6 sm:p-8 rounded-md shadow-2xl w-full max-w-sm relative border-t-4 border-[#F7D622]">
                                <div className="flex justify-between items-center mb-6">
                                    <h2 className="text-xl font-bold text-[#133863] flex items-center gap-2">
                                        <ShieldIcon className="text-[#F7D622] w-6 h-6" /> Адмін-доступ
                                    </h2>
                                    <button type="button" onClick={() => setShowLogin(false)} aria-label="Закрити" className="text-gray-400 hover:text-gray-600 transition-colors"><XIcon className="w-5 h-5" /></button>
                                </div>
                                <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && handleLogin()} className="w-full p-3 border-2 border-gray-200 rounded-md mb-6 focus:border-[#133863] outline-none transition-colors font-medium" placeholder="Введіть пароль" autoFocus />
                                <button type="button" onClick={handleLogin} className="w-full bg-[#133863] hover:bg-[#0A2240] text-white font-bold py-3 rounded-md transition-colors">Увійти</button>
                            </div>
                        </div>
                    )}

                    {activeScreen === 'menu' && (
                        isAdmin ? (
                            <div className="p-4 sm:p-6 max-w-5xl mx-auto">
                                <header className="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 sm:mb-8 bg-white p-4 rounded-md shadow-sm border border-gray-200 gap-4">
                                    <h1 className="text-lg sm:text-xl font-bold flex items-center gap-3 text-[#133863]">
                                        <ShieldIcon className="text-[#F7D622] w-6 h-6 shrink-0" /> Панель адміністратора
                                    </h1>
                                    <div className="flex flex-wrap items-center gap-2 sm:gap-3 w-full md:w-auto">
                                        <a href="https://docs.google.com/spreadsheets/d/1izjgN3KcH0ow0PgQz38O3rEq1l4Zplbm-rMg5jA-1j0/edit?gid=0#gid=0" target="_blank" rel="noopener noreferrer" className="flex-1 sm:flex-none flex justify-center items-center gap-2 px-4 py-2 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 text-emerald-800 rounded-md font-bold text-sm transition">
                                            <FileTextIcon className="w-4 h-4 sm:w-5 sm:h-5" /> Таблиця
                                        </a>
                                        <button type="button" onClick={handleCompileHTML} className="flex-1 sm:flex-none flex justify-center items-center gap-2 px-4 py-2 bg-[#133863] hover:bg-[#0A2240] text-white rounded-md font-bold text-sm shadow-sm transition">
                                            <DownloadIcon className="w-4 h-4" /> Зберегти зміни
                                        </button>
                                        <button type="button" onClick={() => setIsAdmin(false)} className="flex-1 sm:flex-none px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-md font-medium text-sm text-gray-700 transition">
                                            Вийти
                                        </button>
                                    </div>
                                </header>

                                <div className="bg-white p-4 sm:p-6 rounded-md shadow-sm border border-gray-200 mb-6 sm:mb-8">
                                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-6 border-b pb-4">
                                        <h3 className="text-base sm:text-lg font-bold text-[#133863]">Керування модулями та видимістю</h3>
                                        <button type="button" onClick={handleCreateModule} className="w-full sm:w-auto justify-center px-4 py-2 bg-[#F7D622] hover:bg-[#e5c61a] text-[#133863] rounded-md text-sm font-bold transition flex items-center gap-2">
                                            <PlusIcon className="w-4 h-4" /> Створити новий модуль
                                        </button>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {quizData.map((mod, idx) => (
                                            <div key={mod.id} className="p-4 bg-[#f8fafc] rounded-md border border-slate-200 flex flex-col justify-between gap-3">
                                                <div>
                                                    <span className="text-xs font-black text-slate-400 block mb-1 tracking-wider">МОДУЛЬ {idx + 1} {mod.isHidden && <span className="text-red-500 ml-2">(Прихований)</span>}</span>
                                                    <input 
                                                        type="text" 
                                                        value={mod.title} 
                                                        onChange={(e) => updateModuleTitle(idx, e.target.value)} 
                                                        className="w-full p-2 border border-slate-300 rounded focus:border-[#133863] outline-none text-sm font-bold bg-white" 
                                                    />
                                                </div>
                                                <div className="flex items-center justify-between border-t pt-3 border-slate-200 mt-2">
                                                    <label className="flex items-center gap-2 cursor-pointer text-xs font-bold text-slate-600">
                                                        <input 
                                                            type="checkbox" 
                                                            checked={!mod.isHidden} 
                                                            onChange={() => toggleModuleVisibility(idx)} 
                                                            className="w-4 h-4 accent-[#133863]"
                                                        />
                                                        Відображати юристам
                                                    </label>
                                                    <span className="text-xs text-[#133863] font-bold bg-[#eef3f8] px-2 py-1 rounded">{mod.questions.length} питань</span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {currentAdminModule && (
                                    <div className="bg-white rounded-md shadow-sm border border-gray-200 overflow-hidden">
                                        <div className="flex border-b overflow-x-auto bg-[#f8fafc]">
                                            {quizData.map((mod, idx) => (
                                                <button type="button" key={mod.id} onClick={() => selectAdminTab(idx)} className={`px-4 sm:px-6 py-3 sm:py-4 whitespace-nowrap font-bold transition-colors border-b-2 text-sm ${effectiveAdminTab === idx ? 'border-[#133863] text-[#133863] bg-white' : 'border-transparent text-gray-500 hover:bg-gray-100'}`}>
                                                    Модуль {idx + 1} {mod.isHidden ? "👁️‍🗨️" : ""}
                                                </button>
                                            ))}
                                        </div>

                                        <div className="p-4 sm:p-6">
                                            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-3 border-b pb-4">
                                                <h2 className="text-base sm:text-lg font-bold text-[#133863]">{currentAdminModule.title}</h2>
                                                <span className="bg-[#eef3f8] text-[#133863] text-xs font-bold px-3 py-1 rounded-md uppercase tracking-wider shrink-0">{currentAdminModule.questions.length} питань у базі</span>
                                            </div>

                                            {currentAdminModule.questions.length > 0 && (
                                                <div className="mb-4 relative">
                                                    <SearchIcon className="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none" />
                                                    <input
                                                        type="text"
                                                        value={adminSearchQuery}
                                                        onChange={(e) => {
                                                            setAdminSearchQuery(e.target.value);
                                                            setVisibleQuestionsCount(ADMIN_PAGE_SIZE);
                                                        }}
                                                        placeholder="Пошук за текстом запитання, відповіді або норми..."
                                                        className="w-full pl-9 pr-9 py-2.5 border border-slate-300 rounded-md text-sm font-medium focus:border-[#133863] outline-none bg-[#f8fafc]"
                                                    />
                                                    {adminSearchQuery && (
                                                        <button
                                                            type="button"
                                                            onClick={() => setAdminSearchQuery('')}
                                                            aria-label="Очистити пошук"
                                                            className="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600"
                                                        >
                                                            <XIcon className="w-4 h-4" />
                                                        </button>
                                                    )}
                                                </div>
                                            )}

                                            {visibleAdminQuestions.length === 0 ? (
                                                <div className="py-10 text-center text-slate-500 font-medium bg-[#f8fafc] rounded-md border border-dashed border-slate-300">
                                                    {currentAdminModule.questions.length === 0
                                                        ? "У цьому модулі ще немає питань. Додайте питання вручну або імпортуйте JSON."
                                                        : "За вашим пошуковим запитом питань не знайдено."}
                                                </div>
                                            ) : (
                                                <div className="space-y-6 max-h-[60vh] overflow-y-auto pr-1 sm:pr-2">
                                                    {visibleAdminQuestions.map(({ q, originalIdx }) => (
                                                        <AdminQuestionCard
                                                            key={`${effectiveAdminTab}-${originalIdx}`}
                                                            q={q}
                                                            qIdx={originalIdx}
                                                            modIdx={effectiveAdminTab}
                                                            onUpdate={updateQuestion}
                                                            onDeleteRequest={handleDeleteRequest}
                                                        />
                                                    ))}
                                                </div>
                                            )}

                                            {filteredAdminQuestions.length > visibleQuestionsCount && (
                                                <div className="flex flex-col sm:flex-row items-center justify-between gap-3 mt-4 p-3 bg-[#f8fafc] border border-slate-200 rounded-md">
                                                    <span className="text-xs font-bold text-slate-500">
                                                        Показано {visibleAdminQuestions.length} з {filteredAdminQuestions.length} питань
                                                    </span>
                                                    <div className="flex gap-2 w-full sm:w-auto">
                                                        <button
                                                            type="button"
                                                            onClick={() => setVisibleQuestionsCount(prev => prev + ADMIN_PAGE_SIZE)}
                                                            className="flex-1 sm:flex-none px-4 py-2 bg-white border border-slate-300 hover:border-[#133863] text-[#133863] rounded text-xs font-bold transition-colors"
                                                        >
                                                            Показати ще {Math.min(ADMIN_PAGE_SIZE, filteredAdminQuestions.length - visibleQuestionsCount)}
                                                        </button>
                                                        <button
                                                            type="button"
                                                            onClick={() => setVisibleQuestionsCount(filteredAdminQuestions.length)}
                                                            className="flex-1 sm:flex-none px-4 py-2 bg-[#133863] hover:bg-[#0A2240] text-white rounded text-xs font-bold transition-colors"
                                                        >
                                                            Показати всі ({filteredAdminQuestions.length})
                                                        </button>
                                                    </div>
                                                </div>
                                            )}
                                            
                                            <div className="flex flex-col sm:flex-row gap-3 sm:gap-4 mt-6 sm:mt-8 pt-6 border-t">
                                                <button type="button" onClick={() => addNewQuestion(effectiveAdminTab)} className="flex-1 py-3 px-4 border-2 border-dashed border-gray-300 rounded-md text-gray-600 text-sm font-bold hover:bg-gray-50 hover:text-[#133863] transition-all flex items-center justify-center gap-2">
                                                    <PlusIcon className="w-5 h-5 shrink-0" /> Створити питання вручну
                                                </button>
                                                
                                                <label className="flex-1 py-3 px-4 border-2 border-dashed border-emerald-300 rounded-md text-emerald-700 text-sm font-bold hover:bg-emerald-50 transition-all flex items-center justify-center gap-2 cursor-pointer">
                                                    <UploadIcon className="w-5 h-5 shrink-0" /> Імпорт з файлу (JSON)
                                                    <input type="file" accept=".json" className="hidden" onChange={handleImportJSON} />
                                                </label>

                                                <button type="button" onClick={handleExportJSON} className="flex-1 py-3 px-4 border-2 border-dashed border-indigo-300 rounded-md text-indigo-700 text-sm font-bold hover:bg-indigo-50 transition-all flex items-center justify-center gap-2">
                                                    <DownloadIcon className="w-5 h-5 shrink-0" /> Експортувати базу (JSON)
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        ) : (
                            <div>
                                <header className="bg-[#133863] border-b-4 border-[#F7D622] text-white pt-14 pb-10 sm:py-12 px-4 sm:px-6 shadow-md mb-8 sm:mb-10 text-center relative overflow-hidden">
                                    <button type="button" onClick={() => setShowLogin(true)} aria-label="Вхід для адміністратора" title="Вхід для адміністратора" className="absolute top-4 left-4 sm:top-6 sm:left-6 p-2 hover:bg-white/10 rounded-md transition-colors">
                                        <ShieldIcon className="text-[#F7D622] w-6 h-6" />
                                    </button>
                                    <div className="max-w-5xl mx-auto flex flex-col items-center relative z-10">
                                        <div className="mb-4">
                                            <h1 className="text-2xl sm:text-3xl md:text-4xl font-black mb-1 tracking-wider uppercase">Система надання</h1>
                                            <h2 className="text-lg sm:text-xl md:text-2xl font-semibold tracking-wide text-blue-100">безоплатної правничої допомоги</h2>
                                        </div>
                                        <div className="w-16 h-1 bg-[#F7D622] my-3 sm:my-4 rounded"></div>
                                        <h3 className="text-xl sm:text-2xl font-bold">Портал тестування юристів</h3>
                                    </div>
                                </header>
                                
                                <div className="max-w-5xl mx-auto px-4 sm:px-6 pb-12">
                                    <h2 className="text-lg sm:text-xl font-bold text-[#133863] mb-6 text-center uppercase tracking-wide">Оберіть модуль тестування:</h2>
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 sm:gap-6">
                                        
                                        <div onClick={() => initiateQuiz('combined')} className="flex flex-col bg-[#F7D622] rounded-md p-6 shadow-sm border border-[#e5c61a] hover:shadow-md cursor-pointer group transition-all">
                                            <div className="w-12 h-12 rounded flex items-center justify-center mb-6 bg-[#133863] text-white shadow-sm"><LayersIcon className="w-6 h-6" /></div>
                                            <h3 className="text-lg font-black text-[#133863] mb-6 uppercase tracking-wide">Об'єднаний іспит</h3>
                                            <div className="flex items-center text-sm font-bold text-[#133863] bg-white/50 border border-[#e5c61a] p-3 rounded mt-auto">
                                                <span>Почати тестування</span><ArrowRightIcon className="w-5 h-5 ml-auto group-hover:translate-x-1 transition-transform" />
                                            </div>
                                        </div>

                                        {quizData.filter(quiz => !quiz.isHidden).map((quiz) => (
                                            <div key={quiz.id} onClick={() => initiateQuiz(quiz.id)} className="flex flex-col bg-white rounded-md p-6 shadow-sm border border-slate-200 hover:shadow-md hover:border-[#133863] cursor-pointer group transition-all">
                                                <div className={`w-12 h-12 rounded flex items-center justify-center mb-6 ${quiz.bgColor} ${quiz.color}`}>{getIconComponent(quiz.icon, "w-6 h-6")}</div>
                                                <h3 className="text-lg font-bold text-slate-800 mb-6 group-hover:text-[#133863] transition-colors leading-snug">{quiz.title}</h3>
                                                <div className="flex items-center text-sm font-bold text-[#133863] bg-[#f4f6f9] border border-slate-100 p-3 rounded mt-auto transition-colors">
                                                    <span>Почати тестування</span><ArrowRightIcon className="w-5 h-5 ml-auto group-hover:translate-x-1 transition-transform" />
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )
                    )}

                    {activeScreen === 'preQuiz' && (
                        <div className="min-h-screen flex items-center justify-center p-4 sm:p-6">
                            <div className="bg-white p-6 sm:p-8 rounded-md shadow-lg border-t-4 border-[#133863] w-full max-w-md text-center">
                                <UsersIcon className="w-12 h-12 text-[#133863] mx-auto mb-4" />
                                <h2 className="text-xl sm:text-2xl font-black text-[#133863] uppercase tracking-wide mb-2">Підготовка до іспиту</h2>
                                {pendingQuizTitle && <p className="text-xs font-bold text-[#133863] bg-[#eef3f8] px-3 py-1.5 rounded mb-3 inline-block">{pendingQuizTitle}</p>}
                                <p className="text-slate-500 mb-6 text-sm font-medium">Час на проходження: 20 хвилин.<br/>Результати фіксуються автоматично.</p>
                                <div className="text-left mb-8">
                                    <label className="block text-xs font-bold text-[#133863] uppercase tracking-wider mb-2">Вкажіть ваше ПІБ:</label>
                                    <input
                                        type="text"
                                        value={userName}
                                        onChange={(e) => setUserName(e.target.value)}
                                        onKeyDown={(e) => e.key === 'Enter' && confirmStartQuiz()}
                                        placeholder="Іванов Іван Іванович"
                                        className="w-full p-3 border border-slate-300 rounded focus:border-[#133863] outline-none transition-colors font-semibold"
                                        autoFocus
                                    />
                                </div>
                                <div className="flex gap-3">
                                    <button type="button" onClick={() => setActiveScreen('menu')} className="flex-1 py-3 bg-slate-100 text-slate-600 font-bold rounded hover:bg-slate-200 transition-colors">Скасувати</button>
                                    <button type="button" onClick={confirmStartQuiz} className="flex-1 py-3 bg-[#133863] text-white font-bold rounded hover:bg-[#0A2240] transition-colors">Почати</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {activeScreen === 'quiz' && sessionQuestions[currentQuestionIndex] && (
                        <div className="min-h-screen flex flex-col items-center p-4 sm:p-6 exam-mode-active">
                            <div className="w-full max-w-3xl mb-4 sm:mb-6 flex flex-wrap items-center justify-between gap-3 bg-white p-3 sm:p-4 rounded-md shadow-sm border border-slate-200">
                                <div className="text-xs sm:text-sm font-bold text-slate-500 tracking-wide uppercase">
                                    Питання <span className="text-[#133863] text-lg sm:text-xl mx-1">{currentQuestionIndex + 1}</span> з {sessionQuestions.length}
                                </div>
                                <QuizTimer initialSeconds={EXAM_DURATION_SECONDS} onTimeUp={handleTimeUp} />
                            </div>

                            <div className="w-full max-w-3xl bg-white rounded-md shadow-sm border border-slate-200 overflow-hidden">
                                <div className="w-full bg-slate-100 h-1.5"><div className="bg-[#F7D622] h-1.5 transition-all duration-300" style={{ width: `${((currentQuestionIndex + 1) / sessionQuestions.length) * 100}%` }}></div></div>
                                <div className="p-5 sm:p-8 md:p-10">
                                    <h2 className="text-lg sm:text-xl md:text-2xl font-bold text-[#133863] mb-6 sm:mb-8 leading-relaxed">{sessionQuestions[currentQuestionIndex].question}</h2>
                                    <div className="space-y-3">
                                        {sessionQuestions[currentQuestionIndex].options.map((option, index) => {
                                            const isSelected = userAnswers[currentQuestionIndex] === index;
                                            return (
                                                <button type="button" key={index} onClick={() => handleOptionSelect(index)} className={`w-full text-left p-3.5 sm:p-4 rounded border transition-all flex items-start gap-3 sm:gap-4 ${isSelected ? 'border-[#133863] bg-[#eef3f8]' : 'border-slate-200 bg-white hover:border-[#133863]'}`}>
                                                    <div className="mt-0.5 shrink-0"><div className={`w-5 h-5 rounded-full border-2 flex items-center justify-center transition-colors ${isSelected ? 'border-[#133863]' : 'border-slate-300'}`}>{isSelected && <div className="w-2.5 h-2.5 bg-[#133863] rounded-full"></div>}</div></div>
                                                    <span className={`font-semibold text-sm sm:text-base md:text-lg ${isSelected ? 'text-[#133863]' : 'text-slate-700'}`}>{option.text}</span>
                                                </button>
                                            );
                                        })}
                                    </div>
                                    <div className="mt-8 sm:mt-10 flex flex-col-reverse sm:flex-row justify-between items-stretch sm:items-center gap-3 border-t pt-6">
                                        {currentQuestionIndex > 0 ? (
                                            <button type="button" onClick={handlePrevQuestion} className="flex items-center justify-center px-6 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded transition-colors uppercase tracking-wide text-sm">
                                                <ArrowLeftIcon className="w-4 h-4 mr-2" /> Назад
                                            </button>
                                        ) : <div className="hidden sm:block" />}
                                        <button type="button" onClick={handleNextQuestion} disabled={userAnswers[currentQuestionIndex] === null} className="flex items-center justify-center px-8 py-3 bg-[#133863] hover:bg-[#0A2240] text-white font-bold rounded shadow-sm transition-all disabled:opacity-50 disabled:cursor-not-allowed uppercase tracking-wide text-sm">
                                            {currentQuestionIndex < sessionQuestions.length - 1 ? 'Наступне питання' : 'Завершити іспит'} <ArrowRightIcon className="w-4 h-4 ml-3" />
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {activeScreen === 'result' && (
                        <div className="min-h-screen bg-white pb-12">
                            <div className="max-w-4xl mx-auto flex flex-wrap items-center justify-between gap-3 p-4 sm:p-6 bg-slate-50 border-b no-print mb-6 sm:mb-8">
                                <button type="button" onClick={goHome} className="flex items-center py-2 px-4 bg-white border border-slate-300 text-slate-700 font-bold rounded hover:bg-slate-100 transition-colors text-sm shadow-sm"><HomeIcon className="w-4 h-4 mr-2" /> На головну</button>
                                <div className="flex gap-3">
                                    <button type="button" onClick={handleExportWord} className="flex items-center py-2 px-4 bg-blue-600 text-white font-bold rounded hover:bg-blue-700 transition-colors text-sm shadow-sm"><FileTextIcon className="w-4 h-4 mr-2" /> Завантажити у Word (.doc)</button>
                                </div>
                            </div>

                            <div className="max-w-4xl mx-auto px-4 sm:px-6 print:px-0">
                                <div className="text-center mb-6 sm:mb-8 border-b-[3px] border-[#133863] pb-6 sm:pb-8">
                                    <ShieldIcon className="w-12 h-12 sm:w-16 sm:h-16 mx-auto text-[#133863] mb-4" />
                                    <h1 className="text-2xl sm:text-3xl font-black text-[#133863] uppercase tracking-widest mb-2">Досьє результатів тестування</h1>
                                    <h2 className="text-base sm:text-lg font-bold text-slate-600">{currentQuizMeta?.title}</h2>
                                </div>
                                
                                <div className="flex flex-col md:flex-row justify-between items-center bg-[#f4f6f9] border border-slate-200 p-5 sm:p-8 rounded-md mb-8 gap-6">
                                    <div className="text-center md:text-left">
                                        <p className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Юрист:</p>
                                        <p className="text-xl sm:text-2xl font-black text-[#133863] uppercase break-words">{userName}</p>
                                        <p className="text-sm font-semibold text-slate-500 mt-2">Дата: {currentDate}</p>
                                        {syncStatus !== 'idle' && (
                                            <span className={`inline-block mt-2 text-xs font-bold px-2.5 py-1 rounded ${syncStatus === 'sent' ? 'bg-emerald-100 text-emerald-800' : syncStatus === 'offline' ? 'bg-amber-100 text-amber-800' : 'bg-blue-100 text-[#133863]'}`}>
                                                {syncStatus === 'sent' ? 'Результати надіслано в таблицю' : syncStatus === 'offline' ? 'Офлайн-режим: збережено локально' : 'Надсилання результатів...'}
                                            </span>
                                        )}
                                    </div>
                                    
                                    <div className="flex items-center justify-center gap-6 sm:gap-8 bg-white p-4 rounded border border-slate-200 w-full md:w-auto">
                                        <div className="text-center">
                                            <p className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Ваш бал</p>
                                            <p className="text-3xl sm:text-4xl font-black text-[#133863]">{score}<span className="text-lg sm:text-xl text-slate-300">/{sessionQuestions.length}</span></p>
                                        </div>
                                        <div className="w-px h-12 bg-slate-200"></div>
                                        <div className="text-center">
                                            <p className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Успішність</p>
                                            <p className={`text-3xl sm:text-4xl font-black ${resultPercentage >= 80 ? 'text-emerald-600' : 'text-red-500'}`}>{resultPercentage}%</p>
                                        </div>
                                    </div>
                                </div>

                                <h3 className="text-lg sm:text-xl font-bold text-[#133863] mb-6 uppercase tracking-wide border-l-4 border-[#F7D622] pl-3">Детальний розбір відповідей:</h3>
                                <div className="space-y-4">
                                    {sessionQuestions.map((q, idx) => {
                                        const uAnsIdx = userAnswers[idx];
                                        const isCorrect = uAnsIdx === q.correctIndex;
                                        const skipped = uAnsIdx === null || uAnsIdx === undefined;
                                        const correctOption = q.options[q.correctIndex] || {};

                                        return (
                                            <div key={idx} className="p-4 sm:p-6 border-l-4 bg-white border-t border-r border-b border-slate-100 print-border print-break-inside-avoid" style={{ borderLeftColor: isCorrect ? '#10b981' : '#ef4444' }}>
                                                <p className="font-bold text-base text-slate-800 mb-4 leading-relaxed">
                                                    <span className="text-slate-400 mr-2">#{idx + 1}.</span> {q.question}
                                                </p>
                                                
                                                <div className="mb-3">
                                                    <span className="font-bold block text-xs uppercase mb-1 text-slate-500">Ваша відповідь:</span>
                                                    <p className={`font-semibold text-sm p-3 rounded ${isCorrect ? 'bg-emerald-50 text-emerald-800 border border-emerald-100' : 'bg-red-50 text-red-800 border border-red-100'}`}>
                                                        {skipped ? "Не надано відповіді (час вичерпано)" : q.options[uAnsIdx]?.text}
                                                        <span className="ml-2 font-black">{isCorrect ? '(✓ Вірно)' : '(✗ Помилка)'}</span>
                                                    </p>
                                                </div>

                                                {!isCorrect && (
                                                    <div className="mb-3">
                                                        <span className="font-bold block text-xs uppercase mb-1 text-emerald-600">Правильна відповідь:</span>
                                                        <p className="font-semibold text-sm p-3 rounded bg-emerald-50 text-emerald-800 border border-emerald-100">
                                                            {correctOption.text}
                                                        </p>
                                                    </div>
                                                )}

                                                <div className="mt-4 pt-3 border-t border-slate-100">
                                                    <span className="font-bold block text-xs uppercase mb-1 text-[#133863]">Обґрунтування (Норма):</span>
                                                    <p className="text-slate-600 text-sm leading-relaxed font-medium">
                                                        {correctOption.rationale}
                                                    </p>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const container = document.getElementById('app');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
